<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Комп’ютер чи смартфон? Тренажер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--paper:#eef2f8;--ink:#1d2b53;--muted:#5b6788;--line:#d5dcea;--card:#fff;--sun:#ffc83d;--ok:#16895a;--okbg:#e3f6ec;--err:#c9363b;--errbg:#fde8e8;--info:#2f5bea;--infobg:#e7edff;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#121a2e;--ink:#e8ecf7;--muted:#a3adc8;--line:#2b3656;--card:#1a2440;--okbg:#133a2a;--errbg:#43191c;--infobg:#1b2a5c;--ok:#4fd39a;--err:#ff8a8e;--info:#9bb2ff;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#121a2e;--ink:#e8ecf7;--muted:#a3adc8;--line:#2b3656;--card:#1a2440;--okbg:#133a2a;--errbg:#43191c;--infobg:#1b2a5c;--ok:#4fd39a;--err:#ff8a8e;--info:#9bb2ff;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.45}
[hidden]{display:none!important}
button{font:inherit}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:10px 20px;max-width:1100px;margin:0 auto}
.top .tabs{order:2;margin:0}.top .controls{order:3;margin-left:auto}
.brand{display:flex;gap:14px;align-items:center}
.logo{font-size:22px;display:flex;align-items:center;gap:2px}
.logo b{color:var(--sun);font-size:22px;-webkit-text-stroke:1px var(--ink)}
h1{font-size:1.2rem;font-weight:900;margin:0;letter-spacing:-.01em;line-height:1.15}
.brand p{margin:2px 0 0;color:var(--muted);font-size:.95rem}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--ink);color:var(--paper)}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:700;color:var(--ink);cursor:pointer}
.app{max-width:1100px;margin:0 auto;padding:0 20px 30px}
#side{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;align-self:start}
#side h2{font-size:1.05rem;margin:0 0 10px;font-weight:900}
.tlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.tlist li{display:grid;grid-template-columns:26px 1fr;gap:6px 10px;padding:10px;border-radius:12px}
.tlist li.now{background:var(--infobg)}
.tn{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--paper);display:inline-grid;place-items:center;font-weight:900;font-size:.85rem;flex:none}
.tlist p{margin:0;font-size:.9rem}
.marks{grid-column:2;display:flex;gap:6px}
.mk{font-size:.8rem;padding:1px 8px;border-radius:999px;border:1px solid var(--line);opacity:.5}
.mk.now{opacity:1;border-color:var(--info)}
.mk.done{opacity:1;background:var(--okbg);border-color:var(--ok)}
.mk i{font-style:normal;color:var(--ok);font-weight:900;margin-left:3px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{font-weight:800;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
#coach{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--sun);border-radius:12px;padding:8px 14px;margin-bottom:10px}
.c-top{flex-wrap:wrap}
.chipsn{display:flex;gap:4px}
.chipn{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:900;border:2px solid var(--line);color:var(--muted)}
.chipn.now{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.chipn.done{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.btn.sm{padding:3px 10px;font-size:.88rem}
.c-line{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.c-line .c-step{flex:1 1 320px}
.alltasks{margin:6px 0 2px;padding:8px 12px;background:var(--paper);border-radius:10px;font-size:.9rem}
.alltasks ol{margin:0;padding-left:0;list-style:none;display:grid;gap:4px}
.alltasks li{display:flex;gap:8px;align-items:center}
.alltasks .mk{flex:none}
.c-top{display:flex;align-items:center;gap:8px}
.sp{flex:1}
.c-task{font-weight:900}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block;margin-left:4px}
.dots i.d{background:var(--ok)}.dots i.c{background:var(--sun)}
.c-text{margin:6px 0 4px;font-size:.95rem}
.c-step{font-size:1rem;font-weight:700}
.c-step.muted{color:var(--muted);font-size:.95rem}
.c-msg{font-weight:800;font-size:.95rem}
.c-msg.ok{color:var(--ok)}.c-msg.err{color:var(--err)}.c-msg.info{color:var(--info)}
.c-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:7px 12px;font-weight:700;cursor:pointer}
.btn.prim{background:var(--sun);border-color:var(--sun);color:#3d2e00}
.c-done{display:flex;gap:14px;align-items:center}
.c-done .big{font-size:34px}
.c-done p{margin:2px 0}
.keys{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;margin-top:10px}
.kl{font-weight:800;color:var(--muted);font-size:.9rem}
.kc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-weight:800;color:var(--ink)}
kbd{font-family:inherit;background:var(--paper);border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:1px 7px;margin:0 2px;font-size:.85rem}
.khint{text-align:center;color:var(--muted);font-size:.85rem;margin:6px 0 0}
.scrollx{overflow-x:auto;padding-bottom:6px}
.foot{max-width:1320px;margin:0 auto;padding:0 20px 24px;color:var(--muted);font-size:.85rem}
/* interactions */
.hit{cursor:pointer;user-select:none;-webkit-user-select:none}
.hit:focus-visible{outline:3px solid #2f5bea;outline-offset:2px}
.pulse{outline:3px solid #ffc83d!important;outline-offset:2px;border-radius:8px;position:relative;z-index:4;animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,200,61,.9)}50%{box-shadow:0 0 0 9px rgba(255,200,61,0)}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.pulse,.shake,.caret,.flash .phscreen::after,.pcscreen.flash::after{animation:none!important}}
/* ===== PC ===== */
.monitor{width:max-content;margin:0 auto;border:12px solid #1f2430;border-bottom-width:18px;border-radius:14px;background:#1f2430}
.stand{width:120px;height:26px;margin:0 auto;background:linear-gradient(#2b3140,#1f2430);clip-path:polygon(22% 0,78% 0,100% 100%,0 100%)}
.pcscreen{position:relative;width:820px;height:500px;overflow:hidden;background:radial-gradient(ellipse at 30% 80%,#6aa5ff 0,#2b62d9 40%,#173e9e 80%);font-family:'Segoe UI',system-ui,sans-serif;font-size:13px;color:#1b1b1b}
.pcscreen.flash::after{content:"";position:absolute;inset:0;background:#fff;animation:fl .5s forwards;z-index:60;pointer-events:none}
@keyframes fl{from{opacity:.95}to{opacity:0}}
.dicons{position:absolute;top:12px;left:12px;display:grid;gap:8px}
.dicon{width:78px;display:flex;flex-direction:column;align-items:center;color:#fff;text-shadow:0 1px 2px #0008;padding:6px;border-radius:4px}
.dicon:hover{background:#ffffff26}
.dicon.selected{background:#ffffff40}
.di{font-size:32px}
.win{position:absolute;left:16px;right:16px;top:12px;bottom:56px;background:#fff;border-radius:8px;box-shadow:0 10px 30px #0006;display:flex;flex-direction:column;overflow:hidden}
.wt{height:32px;flex:none;display:flex;align-items:center;justify-content:space-between;padding-left:12px;background:#eef1f7;gap:10px}
.wt>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wbtns{display:flex;margin-left:auto}
.wbtns i,.wx{width:42px;text-align:center;font-style:normal;line-height:32px}
.wx:hover{background:#e81123;color:#fff}
.wsave{font-size:12px;color:#a15c00;font-weight:600}.wsave.ok{color:#107c10}
.ex-bar{display:flex;align-items:center;gap:4px;padding:6px 10px;border-bottom:1px solid #e5e5e5;flex:none}
.newwrap{position:relative}
.btn-new{background:#0067c0;color:#fff;border-radius:4px;padding:5px 12px;font-weight:600}
.tool{padding:4px 7px;border-radius:4px}.tool:hover{background:#eee}
.tool-txt{padding:4px 7px;color:#444}
.sep{width:1px;height:20px;background:#ddd;margin:0 4px}
.menu{position:absolute;top:calc(100% + 4px);left:0;background:#fff;border:1px solid #e3e3e3;border-radius:8px;box-shadow:0 8px 24px #0003;min-width:270px;padding:4px;z-index:8}
.mi{padding:7px 12px;border-radius:4px;display:block;white-space:nowrap}.mi:hover{background:#eef3fb}
.mh{padding:6px 12px 2px;color:#777;font-size:11px;border-top:1px solid #eee;margin-top:4px}
.ex-addr{display:flex;align-items:center;gap:10px;padding:6px 10px;border-bottom:1px solid #eee;color:#666;flex:none}
.addr{flex:1;background:#f3f5f8;border:1px solid #e3e6eb;border-radius:4px;padding:4px 10px;color:#222;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exsearch{width:150px;background:#f3f5f8;border:1px solid #e3e6eb;border-radius:4px;padding:4px 10px}
.ex-main{flex:1;display:flex;min-height:0}
.ex-nav{width:170px;border-right:1px solid #eee;padding:6px;flex:none;overflow:auto}
.navi{padding:6px 10px;border-radius:4px;display:block;white-space:nowrap}.navi:hover{background:#f0f4fa}
.navi.on{background:#dfe9f7}.navi.dim{color:#666}
.ex-nav hr{border:0;border-top:1px solid #eee}
.ex-content{flex:1;padding:12px;overflow:auto}
.ex-content h4{margin:0 0 8px;font-size:13px;color:#444}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.fitem{display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 4px;border-radius:4px;border:1px solid transparent;word-break:break-word}
.fitem:hover{background:#eaf2fd}
.fitem.selected{background:#cce4f7;border-color:#99c9ef}
.fi{font-size:40px;line-height:1.1}
.fitem input{width:100%;font:inherit;border:1px solid #0067c0;padding:2px 4px;text-align:center}
.fitem small{color:#777}
.empty{color:#777;text-align:center;margin-top:40px}
.ex-status{padding:3px 12px;font-size:12px;color:#555;border-top:1px solid #eee;flex:none}
.ribbon{background:#185abd;color:#fff;display:flex;gap:2px;padding:0 8px;flex:none}
.ribbon span{padding:6px 10px}.ribbon .on{background:#fff;color:#185abd;border-radius:4px 4px 0 0;font-weight:600}
.ribbon2{display:flex;gap:10px;align-items:center;padding:6px 14px;border-bottom:1px solid #e3e3e3;flex:none}
.rb{border:1px solid #ddd;border-radius:3px;padding:2px 8px}
.docarea{flex:1;background:#e9e9ec;overflow:auto;padding:16px}
.page{background:#fff;width:440px;min-height:100%;margin:0 auto;padding:28px 36px;box-shadow:0 1px 4px #0002}
.demo{font-size:28px;margin:0;min-height:40px}
.caret{display:inline-block;width:2px;height:26px;background:#222;vertical-align:middle;margin-left:2px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.emo-panel{position:absolute;right:40px;bottom:64px;width:320px;background:#f9f9fb;border:1px solid #ddd;border-radius:10px;box-shadow:0 12px 30px #0005;padding:10px;z-index:20}
.emo-tabs{display:flex;gap:12px;font-size:12px;color:#666;margin-bottom:6px}.emo-tabs b{color:#0067c0}
.emo-count{font-size:12px;margin-bottom:6px;font-weight:600}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
.emo{font-size:22px;text-align:center;padding:4px 0;border-radius:6px}.emo:hover{background:#e6ecf7}
.startm{position:absolute;bottom:52px;left:50%;transform:translateX(-50%);width:470px;background:#f3f5f9f7;border:1px solid #d8dde6;border-radius:10px;box-shadow:0 12px 36px #0005;padding:16px;z-index:25}
.st-search{background:#fff;border:1px solid #ddd;border-radius:18px;padding:7px 14px;color:#666}
.st-h{font-weight:600;margin:14px 0 8px}
.st-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.st-app{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:6px;font-size:12px;text-align:center}
.st-app:hover{background:#fff}
.st-app span:first-child{font-size:26px}
.st-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;border-top:1px solid #dde;padding-top:10px}
.st-pw{padding:4px 10px;border-radius:4px;font-size:16px}
.taskbar{position:absolute;left:0;right:0;bottom:0;height:46px;background:#eef1f7f0;display:flex;align-items:center;justify-content:center;border-top:1px solid #cfd6e3}
.tb-mid{display:flex;gap:4px;align-items:center}
.tbi{position:relative;width:40px;height:38px;display:grid;place-items:center;border-radius:6px;font-size:21px}
.tbi:hover{background:#fff}
.tdot{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:6px;height:3px;border-radius:2px;background:#888}.tdot.act{width:16px;background:#0067c0}
.winlogo{display:grid;grid-template-columns:9px 9px;gap:2px}.winlogo i{width:9px;height:9px;background:#0a74da;display:block}
.tb-search{background:#fff;border:1px solid #d6dbe4;border-radius:16px;padding:4px 14px;color:#666;margin:0 6px}
.tb-right{position:absolute;right:12px;display:flex;gap:14px;align-items:center;font-size:11px;text-align:right;line-height:1.2}
.set{display:flex;flex:1;min-height:0}
.set-nav{width:220px;background:#f3f3f3;padding:10px;flex:none;overflow:auto}
.set-user{display:flex;gap:8px;align-items:center;margin-bottom:10px}.set-user span:first-child{font-size:28px}
.set-search{background:#fff;border:1px solid #ddd;border-radius:4px;padding:4px 8px;color:#777;margin-bottom:8px}
.set-main{flex:1;padding:16px 20px;display:flex;flex-direction:column;min-height:0;overflow:auto;background:#f9f9f9}
.set-main h2{font-size:22px;margin:0 0 12px;font-weight:600}
.set-main h3{font-size:14px;margin:14px 0 6px}
.slist{flex:1;min-height:0;overflow:auto}
.srow{display:block;padding:11px 14px;background:#fff;border:1px solid #ececec;border-radius:5px;margin-bottom:3px}
.srow:hover{background:#f4f7fc}
.scards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.scard{background:#fff;border:1px solid #eee;border-radius:8px;padding:14px}
.sbox{background:#fff;border:1px solid #eee;border-radius:8px;padding:12px}
.rows p{display:flex;justify-content:space-between;margin:0;padding:7px 12px;background:#fff;border-bottom:1px solid #f0f0f0}
.rows.mark p{background:#fff6cc}
.note-s{font-size:12px;color:#666;margin-top:10px}
.snip{position:absolute;inset:0;background:#0007;z-index:40}
.snip-bar{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:#f3f3f3;border-radius:8px;display:flex;padding:4px;gap:2px;box-shadow:0 6px 20px #0006}
.snb{display:flex;flex-direction:column;align-items:center;padding:6px 10px;font-size:18px;border-radius:6px}.snb:hover{background:#e3e8f1}
.snb small{font-size:11px}
.br-tabs{background:#dee3ea;display:flex;align-items:flex-end;padding:6px 0 0 8px;flex:none}
.br-tab{background:#fff;border-radius:8px 8px 0 0;padding:6px 14px}
.br-plus{padding:6px 10px;color:#555}
.br-addr{display:flex;gap:10px;align-items:center;padding:6px 10px;border-bottom:1px solid #e3e3e3;flex:none;color:#555}
.cr{flex:1;overflow:auto;background:#fff;position:relative}
.cr-head{border-bottom:1px solid #e0e0e0;padding:10px 16px;font-size:15px}
.cr-body{display:grid;grid-template-columns:1fr 250px;gap:20px;padding:18px 22px}
.cr-main{display:flex;gap:14px}
.cr-ic{width:40px;height:40px;border-radius:50%;background:#1e8e3e;display:grid;place-items:center;font-size:20px;flex:none}
.cr-main h2{font-size:20px;margin:0;font-weight:500;color:#1e8e3e}
.cr-main hr{border:0;border-top:1px solid #1e8e3e;margin:10px 0}
.muted{color:#666}
.cr-card{border:1px solid #dadce0;border-radius:8px;padding:14px;box-shadow:0 1px 3px #0001;align-self:start;background:#fff}
.cr-card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.st-as{color:#1e8e3e;font-size:12px}.st-ok{color:#1967d2;font-weight:700;font-size:12px}
.cr-btn{display:block;border:1px solid #dadce0;color:#1967d2;border-radius:4px;padding:8px;text-align:center;margin-top:8px;font-weight:600}
.cr-btn.prim{background:#1967d2;color:#fff;border-color:#1967d2}
.addwrap{position:relative}
.cr-menu{min-width:220px}
.att{border:1px solid #dadce0;border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;margin:6px 0}
.att small{color:#777}
.cr-done{color:#1967d2;font-weight:700;text-align:center;padding:10px;background:#e8f0fe;border-radius:6px;margin-top:8px}
.modal-bg{position:absolute;inset:0;background:#0004;display:grid;place-items:center;z-index:30}
.picker{width:580px;height:350px;background:#fff;border-radius:8px;box-shadow:0 14px 40px #0006;display:flex;flex-direction:column;overflow:hidden}
.pk-main{flex:1;display:flex;min-height:0}
.pk-list{flex:1;padding:8px;overflow:auto}
.prow{display:block;padding:6px 10px;border-radius:4px;border:1px solid transparent}.prow:hover{background:#eaf2fd}
.prow.selected{background:#cce4f7;border-color:#99c9ef}
.pk-foot{display:flex;gap:8px;align-items:center;padding:10px;border-top:1px solid #eee}
.pk-name{flex:1;border:1px solid #ccc;border-radius:4px;padding:4px 8px;min-height:26px}
.pk-btn{border:1px solid #ccc;border-radius:4px;padding:5px 16px;background:#fdfdfd}.pk-btn.prim{background:#0067c0;color:#fff;border-color:#0067c0}
.shot{border:1px solid #bbb;border-radius:6px;overflow:hidden;width:220px;font-size:11px;background:#fff;margin-top:12px;box-shadow:0 2px 6px #0002;text-align:left}
.shot-bar{background:#eef1f7;padding:3px 8px;font-weight:600}
.shot-b{padding:6px 8px;display:flex;flex-direction:column;gap:2px}
.shot.ph{width:130px}
.shotimg{position:relative;overflow:hidden;pointer-events:none;border:1px solid #9aa3b2;box-shadow:0 2px 8px #0003;margin-top:12px}
.shotimg.pc{width:361px;height:220px}
.shotimg.pc .shotscale{width:820px;height:500px;transform:scale(.44);transform-origin:0 0;position:absolute;left:0;top:0}
.shotimg.ph{width:139px;height:299px;border-radius:12px}
.shotimg.ph .shotscale{width:278px;height:598px;transform:scale(.5);transform-origin:0 0;position:absolute;left:0;top:0;border-radius:0}
.shotimg.ph.thumb{width:100%;height:100%;margin:0;border:0;border-radius:0;box-shadow:none}
.shotimg.ph.thumb .shotscale{transform:scale(.32)}
.shotimg *{animation:none!important}
/* ===== PHONE ===== */
.phwrap{display:flex;justify-content:center;padding:4px 0}
.phone{position:relative;width:300px;height:620px;border-radius:42px;background:#111827;padding:11px;box-shadow:0 18px 40px #0004}
.sb{position:absolute;right:-5px;width:5px;background:#3b4454;border-radius:0 3px 3px 0}
.sb-vu{top:120px;height:44px}.sb-vd{top:170px;height:44px}.sb-pw{top:240px;height:60px}

<body>
<header class="top">
  <div class="brand"><div class="logo" aria-hidden="true">💻<b>⇄</b>📱</div>
    <div><h1>Комп’ютер чи смартфон?</h1></div></div>
  <div class="controls">
    <div class="seg" role="group" aria-label="Режим підказок">
      <button data-mode="guided">Крок за кроком</button><button data-mode="solo">Самостійно</button>
    </div>
    <button class="chip" id="who"></button>
  </div>
  <nav class="tabs" id="tabs">
      <button data-tab="pc">💻 Комп’ютер</button><button data-tab="ph">📱 Смартфон</button><button data-tab="cmp">📊 Порівняння</button>
  </nav>
</header>
<main class="app">
  <section id="stage">
    <div id="coach"></div>
    <div id="device"></div>
    <div id="keys"></div>
  </section>
</main>
<p class="foot">Тренажер спрощено імітує Windows 11 і Android. На справжніх пристроях назви пунктів і вигляд вікон можуть трохи відрізнятися.</p>

<div id="start" class="overlay">
  <form class="startcard" id="startForm" autocomplete="off">
    <h2>Привіт! 👋</h2>
    <p>Спочатку введи свої дані. Прізвище й ім’я знадобляться для назв папки та документа.</p>
    <label for="fSur">Прізвище</label><input class="f" id="fSur" placeholder="Наприклад: Коваленко">
    <label for="fName">Ім’я</label><input class="f" id="fName" placeholder="Наприклад: Марія">
    <div class="ferr" id="fErr"></div>
    <button class="go" type="submit">Почати</button>
  </form>
</div>
<div id="toast" role="status"></div>

<script>
const $=q=>document.querySelector(q);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

 'Створи папку в папці «Документи» й назви її своїм прізвищем.',

 'Провідник → Документи → Створити → Папку → прізвище + Enter',

 'Відкрити документ → Win + . → вибрати смайлики на панелі',
 'Пуск → Параметри → Система → Про систему. Знімок: PrtSc (весь екран) або Win + Shift + S (частина екрана), він потрапляє в буфер обміну. Вставити: Ctrl + V',

 'Нотатка зберігається сама. Поділитися → Classroom → завдання → Здати']};

 'На якому пристрої для всіх завдань знадобилося менше дій? Чому, на твою думку?',
 'Яку дію на комп’ютері треба виконати самому, а на телефоні вона відбувається автоматично?',
 'Куди потрапляє знімок екрана на комп’ютері, а куди — на телефоні?',

const PC=[

{t:4,id:'pc-start',h:'Відкрий меню «Пуск» — кнопка з логотипом Windows на панелі завдань.',do:s=>{s.start=true}},
{t:4,id:'pc-app-settings',h:'Вибери «Параметри» (значок шестерні ⚙️).',do:s=>{s.start=false;s.win='settings';s.apps.settings=true;s.setPage='home'}},
{t:4,id:'pc-set-system',h:'У лівому меню вибери «Система».',do:s=>{s.setPage='system'}},

function renderSide(){}
function allTasksHTML(){
 return `<div class="alltasks"><ol>${TASKS.map((t,i)=>{const n=i+1;return `<li><span class="marks">${['pc','ph'].map(d=>{const st=taskState(d,n);return `<span class="mk ${st}" title="${d==='pc'?'Комп’ютер':'Смартфон'}">${d==='pc'?'💻':'📱'}${st==='done'?'<i>✓</i>':''}</span>`}).join('')}</span><span><b>${n}.</b> ${t}</span></li>`}).join('')}</ol></div>`}
function renderCoach(){
 const c=$('#coach');
 if(tab==='cmp'){c.hidden=true;return} c.hidden=false;
 const s=S[tab],st=cur(tab);
 const chips=[1,2,3,4,5].map(n=>{const k=taskState(tab,n);return `<span class="chipn ${k}" title="${esc(TASKS[n-1])}">${k==='done'?'✓':n}</span>`}).join('');
 const allBtn=`<button class="btn sm" data-c="all" aria-expanded="${allOpen}">☰ ${allOpen?'Згорнути':'Усі завдання'}</button>`;
 if(!st){const other=tab==='pc'?'ph':'pc',errs=s.errors.reduce((a,b)=>a+b,0);
  c.innerHTML=`<div class="c-done"><div class="big">🎉</div><div><b>Усі 5 завдань на ${tab==='pc'?'комп’ютері':'смартфоні'} виконано!</b> Помилкових натискань: ${errs}.<div class="c-actions">${cur(other)?`<button class="btn prim" data-c="other">${other==='ph'?'📱 Тепер на смартфоні':'💻 Тепер на комп’ютері'}</button>`:'<button class="btn prim" data-c="cmp">📊 Переглянути порівняння</button>'}<button class="btn" data-c="reset">↺ Пройти ще раз</button></div></div></div>`;return}
 const inTask=STEPS[tab].filter(x=>x.t===st.t),idx=inTask.indexOf(st);
 const dots=inTask.map((x,i)=>`<i class="${i<idx?'d':i===idx?'c':''}"></i>`).join('');
 const show=mode==='guided'||s.hint;
 c.innerHTML=`<div class="c-top"><span class="c-task">${tab==='pc'?'💻':'📱'}</span><span class="chipsn" aria-label="Завдання ${st.t} з 5">${chips}</span><span class="dots" aria-label="Крок ${idx+1} з ${inTask.length}">${dots}</span><span class="sp"></span>${allBtn}<button class="btn sm" data-c="hint">💡 ${s.hint?'Сховати':'Підказка'}</button><button class="btn sm" data-c="reset" title="Почати на цьому пристрої знову" aria-label="Почати на цьому пристрої знову">↺</button></div>
 ${allOpen?allTasksHTML():''}
 <p class="c-text"><b>Завдання ${st.t}.</b> ${TASKS[st.t-1]}</p>
 <div class="c-line">${show?`<span class="c-step">👉 ${esc(st.h)}</span>`:'<span class="c-step muted">Спробуй самостійно. Застрягнеш — натисни «Підказка».</span>'}<span class="c-msg ${s.msg?s.msg.type:''}" aria-live="polite">${s.msg?esc(s.msg.text):''}</span></div>`}
function applyHint(){
 document.querySelectorAll('.pulse').forEach(x=>x.classList.remove('pulse'));
 if(tab==='cmp')return; const s=S[tab],st=cur(tab); if(!st||!s.hint)return;
 const root=$('#stage');let els;
 if(st.input) els=root.querySelectorAll(`[data-input="${st.input}"],[data-submit="${st.input}"]`);
 else if(st.id==='emoji') els=root.querySelectorAll('.emoji-grid');
 else els=root.querySelectorAll([st.id,...(st.alt||[])].map(i=>`[data-id="${i}"]`).join(','));
 els.forEach(e=>e.classList.add('pulse'));
 if(els[0]) els[0].scrollIntoView({block:'nearest',inline:'nearest'});
}
function render(){
 renderChrome();renderSide();renderCoach();
 const d=$('#device'),k=$('#keys');
 if(tab==='cmp'){d.innerHTML=cmpHTML();k.innerHTML='';return}
 const s=S[tab];
 d.innerHTML=tab==='pc'?pcHTML(s):phHTML(s);
 k.innerHTML=keysHTML(tab);
 applyHint();
 if(s.flash)setTimeout(()=>{s.flash=false;document.querySelectorAll('.flash').forEach(e=>e.classList.remove('flash'))},600);
 const inp=d.querySelector('[data-input]');if(inp)setTimeout(()=>inp.focus({preventScroll:true}),40);
}
function say(type,text){S[tab].msg={type,text};renderCoach()}

function advance(val,altId){
 const s=S[tab],st=cur(tab);
 if(altId&&st.altDo&&st.altDo[altId])st.altDo[altId](s);else st.do(s,val); s.step++; s.stepErr=0; s.hint=false; s.lastAdv=Date.now();
 const nx=cur(tab);
 s.msg=!nx?{type:'ok',text:'Усе виконано!'}:nx.t!==st.t?{type:'ok',text:`Завдання ${st.t} виконано ✓ Переходь до завдання ${nx.t}.`}:{type:'ok',text:pick(PRAISE)};
 render();
}
function wrong(el){
 const s=S[tab],st=cur(tab);
 if(el.dataset.soft){say('info',el.dataset.msg);return}
 s.errors[st.t]++; s.stepErr++;
 el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');
 let m=el.dataset.msg||pick(['Не туди. Прочитай підказку ще раз.','Це не те, що потрібно зараз.','Спробуй знайти інше місце.']);
 if(s.stepErr>=2&&!s.hint){s.hint=true;m+=' Потрібне місце підсвічено жовтим.'}
 say('err',m);applyHint();
}
function act(el,isDbl){
 if(tab==='cmp')return;
 const s=S[tab],st=cur(tab); if(!st)return;
 if(el.dataset.submit){submitInput(el.dataset.submit);return}
 if(Date.now()-s.lastAdv<380)return;
 const id=el.dataset.id, ok=id===st.id||(st.alt&&st.alt.includes(id));
 if(el.dataset.dbl&&!isDbl){
  el.parentElement.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');
  if(ok)say('info','Щоб відкрити, клацни двічі швидко (або натисни Enter).');
  return}
 if(ok){
  if(st.multi){s.emojis.push(el.dataset.e);s.stepErr=0;
   if(s.emojis.length<st.multi){s.msg={type:'ok',text:`Додано ${s.emojis.length} з ${st.multi}`};render();return}}
  advance(undefined,id!==st.id?id:null);
 } else wrong(el);
}
function submitInput(key){
 const s=S[tab],st=cur(tab); if(!st||st.input!==key)return;
 const inp=$('#device [data-input]'); const v=(inp?inp.value:'').trim(), exp=student[st.val];
 const what=st.val==='surname'?'твоє прізвище':'твоє ім’я';
 if(!v){say('err',`Поле порожнє. Надрукуй ${what}.`);return}
 if(norm(v)!==norm(exp)){s.errors[st.t]++;say('err',`Назва має бути такою: «${exp}» — це ${what}.`);return}
 advance(exp);
}
function typeKey(k){
 const inp=$('#device [data-input]');if(!inp)return;
 if(k.dataset.kbs)inp.value=inp.value.slice(0,-1);
 else{let ch=k.dataset.kch;if(!inp.value&&ch!==' ')ch=ch.toUpperCase();inp.value+=ch}
}

['#device','#keys'].forEach(q=>{const r=$(q);
 r.addEventListener('click',e=>{const k=e.target.closest('[data-kch],[data-kbs]');if(k){typeKey(k);return}
  const el=e.target.closest('[data-id],[data-submit]');if(el)act(el,false)});
 r.addEventListener('dblclick',e=>{const el=e.target.closest('[data-id]');if(el&&el.dataset.dbl)act(el,true)});
 r.addEventListener('keydown',e=>{
  if(e.target.matches('[data-input]')&&e.key==='Enter'){e.preventDefault();submitInput(e.target.dataset.input);return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-id],[data-submit]')){e.preventDefault();act(e.target,!!e.target.dataset.dbl)}});
});
document.addEventListener('keyup',e=>{
 if(tab!=='pc'||!student.name||e.target.matches('input')||e.code!=='PrintScreen')return;
 const el=$('#keys [data-id="k-prt"]');if(el)act(el,false)});
document.addEventListener('keydown',e=>{
 if(tab!=='pc'||!student.name||e.target.matches('input'))return;
 if(e.ctrlKey||e.metaKey){const id={KeyS:'k-save',KeyV:'k-paste',KeyC:'k-copy'}[e.code];
  if(id){e.preventDefault();const el=$(`#keys [data-id="${id}"]`);if(el)act(el,false)}}
});
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;render()});
document.querySelector('.seg').addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(!b)return;mode=b.dataset.mode;render()});
$('#coach').addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(!b)return;const c=b.dataset.c;
 if(c==='hint'){S[tab].hint=!S[tab].hint;renderCoach();applyHint()}
 else if(c==='all'){allOpen=!allOpen;renderCoach()}
 else if(c==='reset'){S[tab]=tab==='pc'?freshPC():freshPH();render()}
 else if(c==='other'){tab=tab==='pc'?'ph':'pc';render()}
 else if(c==='cmp'){tab='cmp';render()}});
$('#who').addEventListener('click',()=>{$('#fSur').value=student.surname;$('#fName').value=student.name;$('#fErr').textContent='';$('#start').hidden=false;$('#fSur').focus()});
$('#startForm').addEventListener('submit',e=>{e.preventDefault();
 const sn=$('#fSur').value.trim(),nm=$('#fName').value.trim();
 if(!sn||!nm){$('#fErr').textContent='Заповни обидва поля.';return}
 const changed=sn!==student.surname||nm!==student.name;
 student={surname:sn,name:nm};
 if(changed){S.pc=freshPC();S.ph=freshPH()}
 $('#start').hidden=true;render()});
renderChrome();renderSide();
setTimeout(()=>$('#fSur').focus(),50);
</script>
</body>
</html>
