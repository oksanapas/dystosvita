<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Інформаційні процеси та комп&#x27;ютер · 5 клас</title>
<style>
:root{
  --bg:#f4f5fa; --card:#ffffff; --ink:#1d2130; --muted:#5b6078; --line:#dcdeea;
  --accent:#31338e; --accent-ink:#ffffff; --accent-soft:#e4e5f3; --brand-soft:#d6d6e7;
  --teal:#2d656c; --navy:#1e4378; --sky:#7ca8e0; --red:#c1272d;
  --ok:#1e7a46; --ok-soft:#e0f2e7; --err:#c1272d; --err-soft:#fbe4e4; --part:#8a6400; --part-soft:#fbf0d4;
  --zone:#fff8d6; --zone-line:#c9a227; --shadow:0 1px 2px rgba(30,33,80,.05),0 4px 14px rgba(30,33,80,.06);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:780px;margin:0 auto;padding:20px 16px 28px}
.brandbar{background:var(--accent);color:#fff;border-top:3px solid #262873}
.brandbar .in{max-width:780px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:14px;min-height:64px}
.logo{flex:none;display:block;background:#fff;border-radius:4px;padding:4px 6px;line-height:0}
.logo img{height:40px;width:auto;display:block}
.brandbar h1{font-size:1rem;font-weight:600;margin:0;flex:1;line-height:1.3}
.brandbar .who{font-size:.85rem;opacity:.85;text-align:right}
.hero{position:relative;overflow:hidden;background:var(--navy);color:#fff;border-radius:12px 12px 0 0;margin:-22px -22px 20px;padding:22px 22px 24px;display:flex;align-items:center;gap:20px;min-height:140px}
.hero .hx{position:absolute;background:#2a5591;height:34px}
.hero .hx.a{top:0;left:58%;width:30%;clip-path:polygon(0 0,100% 0,92% 100%,8% 100%)}
.hero .hx.b{bottom:0;left:4%;width:30%;clip-path:polygon(8% 0,92% 0,100% 100%,0 100%)}
.hero .hnum{position:relative;font:800 92px/1 system-ui,sans-serif;color:var(--sky)}
.hero .htxt{position:relative}
.hero .hk{font-size:.9rem;color:#c9d8f2;font-weight:600;margin-bottom:4px}
.hero .ht{font-size:1.45rem;font-weight:700;line-height:1.25}
footer.foot{max-width:780px;margin:0 auto;padding:0 16px 32px;font-size:.82rem;color:var(--muted);text-align:center}
footer.foot a{color:var(--accent)}
.btn.teal{background:var(--teal);border-color:var(--teal);color:#fff}
.score .big{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;box-shadow:var(--shadow)}
h2{font-size:1.35rem;margin:0 0 6px}
p.lead{color:var(--muted);margin:0 0 18px}
label.f{display:block;font-size:.9rem;font-weight:600;margin:12px 0 4px}
input[type=text]{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input[type=text]:focus{outline:2px solid var(--accent);outline-offset:1px}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px;border-radius:10px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.chip:focus-visible,.zone:focus-visible,.opt:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:space-between;margin-top:20px}
.err-msg{color:var(--err);font-size:.9rem;min-height:1.4em;margin-top:6px}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.dot{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--card);font:600 .85rem/30px system-ui;text-align:center;cursor:pointer;color:var(--ink);padding:0}
.dot.done{background:var(--accent-soft);border-color:var(--accent)}
.dot.cur{background:var(--accent);border-color:var(--accent);color:#fff}
.qnum{font-size:.85rem;color:var(--muted);font-weight:600;margin-bottom:4px}
.qtext{font-size:1.12rem;font-weight:600;margin-bottom:14px}
.qtext p{margin:0 0 .4em}
.qtext img{max-width:100%;height:auto}
.hint{font-size:.88rem;color:var(--muted);margin:-6px 0 12px}
/* drag & drop on image */
.stage{position:relative;container-type:inline-size;margin:0 auto 14px;user-select:none;-webkit-user-select:none;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:#fff}
.stage img{display:block;width:100%;height:auto;pointer-events:none}
.zone{position:absolute;border:2px dashed var(--zone-line);background:var(--zone);border-radius:6px;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#1d2330;font:inherit}
.zone.hot{background:var(--accent-soft);border-style:solid;border-color:var(--accent)}
.zone.ok{border:2px solid var(--ok);background:var(--ok-soft)}
.zone.bad{border:2px solid var(--err);background:var(--err-soft)}
.zone .chip{width:100%;height:100%;border-radius:4px;padding:0 .3em;font-size:inherit;box-shadow:none;justify-content:center}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:10px;border:1px dashed var(--line);border-radius:10px;background:var(--bg)}
.pool.hot{border-color:var(--accent)}
.pool .empty{color:var(--muted);font-size:.9rem;align-self:center}
.chip{display:inline-flex;align-items:center;font:600 15px/1.2 system-ui,sans-serif;padding:8px 12px;border-radius:8px;background:#fff;color:#1d2330;border:1px solid #b9c4d0;box-shadow:0 1px 2px rgba(0,0,0,.08);cursor:grab;touch-action:none;white-space:nowrap}
.chip.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip.wr{white-space:normal;text-align:left;line-height:1.25}
.chip:disabled{cursor:default;opacity:1}
.chip.ok{border:2px solid var(--ok);background:var(--ok-soft);color:var(--ink)}
.chip.bad{border:2px solid var(--err);background:var(--err-soft);color:var(--ink)}
.chip img{max-height:56px;width:auto;display:block}
.pool.sticky{position:sticky;top:0;z-index:5;background:var(--bg);margin-bottom:14px;box-shadow:0 6px 10px -8px rgba(0,0,0,.25)}
.plabel{font-size:.85rem;font-weight:600;color:var(--muted);align-self:center}
/* matching: rows */
.mrows .mitem{display:grid;grid-template-columns:1fr minmax(180px,46%);gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.mrows .mitem:first-child{border-top:0}
.mq p{margin:0}
.mq img{max-width:100%;height:auto;display:block;margin:0 auto}
.slot{min-height:46px;border:2px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;padding:4px;background:var(--bg);cursor:pointer}
.slot .chip{width:100%;justify-content:center;text-align:center}
.slot .ph{color:var(--muted);font-size:.85rem}
.slot.hot,.bucket.hot{border-color:var(--accent);border-style:solid;background:var(--accent-soft)}
.slot.ok{border:2px solid var(--ok);background:var(--ok-soft)}
.slot.bad{border:2px solid var(--err);background:var(--err-soft)}
.slot.ok .chip,.slot.bad .chip{box-shadow:none}
/* matching: cards */
.mcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.mcards .mitem{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:10px;background:var(--card)}
.mcards .mq{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:600;min-height:60px}
.mcards .mq img{max-height:120px;width:auto}
/* buckets */
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.bucket{border:2px dashed var(--line);border-radius:12px;background:var(--bg);display:flex;flex-direction:column;min-height:150px;cursor:pointer}
.bhead{font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--card);border-radius:10px 10px 0 0}
.bbody{display:flex;flex-wrap:wrap;gap:8px;padding:10px;align-content:flex-start;flex:1}
.bbody .empty{color:var(--muted);font-size:.85rem}
@media (max-width:560px){.mrows .mitem{grid-template-columns:1fr;gap:6px}.mcards{grid-template-columns:repeat(2,1fr);gap:8px}.mcards .mq img{max-height:90px}}
.ghost{position:fixed;pointer-events:none;z-index:50;opacity:.92;transform:translate(-50%,-50%) rotate(-2deg);cursor:grabbing}
/* choice */
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer}
.opt input{margin-top:4px;accent-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--err);background:var(--err-soft)}
.match{display:grid;grid-template-columns:1fr minmax(160px,48%);gap:0 14px;align-items:stretch}
.match>div{padding:10px 0;border-top:1px solid var(--line);display:flex;align-items:center}
.match>div>select{width:100%}
.match>div:nth-child(-n+2){border-top:0}
.match>div p{margin:0}
.match img{max-width:100%;height:auto;display:block}
@media (max-width:560px){.match{grid-template-columns:1fr}.match>div{display:block}.match>div:nth-child(2n){border-top:0;padding-top:0}.match>div:nth-child(2){border-top:0}}
select{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
select.ok,input.ok{border-color:var(--ok);background:var(--ok-soft)}
select.bad,input.bad{border-color:var(--err);background:var(--err-soft)}
/* results */
.score{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:6px 0 16px}
.score .big{font-size:2.6rem;font-weight:750;line-height:1}
.score .of{color:var(--muted)}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--accent)}
.list{list-style:none;padding:0;margin:0 0 6px}
.list li{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.tag{font-size:.78rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.bad{background:var(--err-soft);color:var(--err)}
.tag.part{background:var(--part-soft);color:var(--part)}
.list .nm{flex:1}
.list .pts{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.9rem}
.sec{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.sec h3{font-size:1rem;margin:0 0 8px}
.note{font-size:.88rem;color:var(--muted)}
.banner{padding:10px 12px;border-radius:10px;margin-bottom:14px;font-size:.92rem}
.banner.rev{background:var(--part-soft);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:520px){.card{padding:16px}.wrap{padding:12px 12px 24px}.hero{margin:-16px -16px 18px;padding:18px 16px 20px;gap:14px;min-height:120px}.hero .hnum{font-size:72px}.hero .ht{font-size:1.25rem}.brandbar h1{display:none}.brandbar .who{flex:1}.logo img{height:36px}}
footer.foot a{white-space:nowrap}
</style>
</head>

const Q = DATA.questions;
const S = { name:'', cls:'', attempts:[], cur:null, view:'start', idx:0, sel:null };
const $ = (s,r=document)=>r.querySelector(s);
const el = (t,a={},...k)=>{const e=document.createElement(t);for(const[n,v]of Object.entries(a)){if(n==='class')e.className=v;else if(n==='html')e.innerHTML=v;else if(n.startsWith('on'))e.addEventListener(n.slice(2),v);else if(v!==false&&v!=null)e.setAttribute(n,v===true?'':v)}k.flat().forEach(c=>c!=null&&e.append(c.nodeType?c:document.createTextNode(c)));return e};

/* ---------- grading ---------- */
function grade(qi, a){
  const q=Q[qi];
  if(a==null) return 0;
  switch(q.type){
    case 'ddimageortext': { let c=0; q.drops.forEach(d=>{ if(a[d.no]===d.choice) c++; }); return c/q.drops.length; }
    case 'choice': {
      if(q.single) return Math.max(0, q.opts[a]?.f||0);
      let s=0; (a||[]).forEach(i=>s+=q.opts[i].f); return Math.min(1,Math.max(0,s)); }
    case 'shortanswer': {
      const v=(a||'').trim(); if(!v) return 0;
      for(const x of q.answers){ const re=new RegExp('^'+x.t.split('*').map(p=>p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('.*')+'$', q.case?'':'i'); if(re.test(v)) return x.f; }
      return 0; }
    case 'numerical': {
      const v=parseFloat(String(a).replace(',','.')); if(isNaN(v)) return 0;
      for(const x of q.answers){ if(x.t==='*' || Math.abs(v-parseFloat(x.t))<=x.tol+1e-9) return x.f; } return 0; }
    case 'matching': { let c=0,n=0; q.pairs.forEach((p,i)=>{ if(!p.q) return; n++; if(a[i]===p.a) c++; }); return n?c/n:0; }
  }
  return 0;
}
function answered(qi,a){
  const q=Q[qi]; if(a==null) return false;
  if(q.type==='ddimageortext') return Object.keys(a).length>0;
  if(q.type==='choice') return q.single ? a!=null : a.length>0;
  if(q.type==='matching') return Object.values(a).some(v=>v);
  return String(a).trim()!=='';
}
const status = f => f>=0.999?'ok':(f>0?'part':'bad');
const statusText = {ok:'правильно',part:'частково',bad:'неправильно'};

/* ---------- views ---------- */
function render(){
  $('#who').textContent = S.name ? S.name+(S.cls?', '+S.cls:'') : '';
  app.replaceChildren();
  if(S.view==='start') return viewStart();
  if(S.view==='quiz' || S.view==='review') return viewQuestion();
  if(S.view==='result') return viewResult();
}

function hero(){
  const m=DATA.title.match(/(\d+)\s*клас/);
  const t=DATA.title.replace(/\s*[·\-–]\s*\d+\s*клас\S*\s*$/,'');
  return el('div',{class:'hero'},el('span',{class:'hx a'}),el('span',{class:'hx b'}),
    m?el('div',{class:'hnum'},m[1]):null,
    el('div',{class:'htxt'},el('div',{class:'hk'},m?`Інформатика ${m[1]} клас (НУШ)`:'Інформатика'),el('div',{class:'ht'},t)));
}
function viewStart(){
  const name=el('input',{type:'text',id:'nm',autocomplete:'name',value:S.name});
  const cls=el('input',{type:'text',id:'cl',value:S.cls});
  const msg=el('div',{class:'err-msg'});
  const go=()=>{ if(!name.value.trim()){msg.textContent='Введіть прізвище та ім’я.';name.focus();return;}
    S.name=name.value.trim(); S.cls=cls.value.trim(); startAttempt(Q.map((_,i)=>i)); };
  [name,cls].forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')go()}));
  app.append(el('section',{class:'card'},
    hero(),
    el('p',{class:'lead'},`${Q.length} ${plural(Q.length,'питання','питання','питань')}. Результат буде видно в кінці, тоді ж можна переглянути помилки й виправити їх.`),
    el('label',{class:'f',for:'nm'},'Прізвище та ім’я'), name,
    el('label',{class:'f',for:'cl'},'Клас'), cls, msg,
    el('div',{class:'row end'}, el('span'), el('button',{class:'btn primary',onclick:go},'Почати'))
  ));
  name.focus();
}
function plural(n,a,b,c){const m=n%10,h=n%100;return m===1&&h!==11?a:(m>=2&&m<=4&&(h<10||h>=20)?b:c)}

function startAttempt(qset){
  S.cur={ qset, answers:{}, when:new Date() };
  S.idx=0; S.sel=null; S.view='quiz'; render();
}

function viewQuestion(){
  const review = S.view==='review';
  const att = review ? S.reviewAtt : S.cur;
  const qset = review ? S.reviewSet : att.qset;
  const qi = qset[S.idx], q=Q[qi];
  const card=el('section',{class:'card'});
  if(review) card.append(el('div',{class:'banner rev'},'Перегляд помилок. Червоним позначено неправильні відповіді.'));
  if(qset.length>1){
    const dots=el('div',{class:'dots'});
    qset.forEach((qq,i)=>{ const b=el('button',{class:'dot'+(i===S.idx?' cur':''),onclick:()=>{S.idx=i;S.sel=null;render();},'aria-label':'Питання '+(i+1)},String(i+1));
      if(!review && answered(qq,att.answers[qq])) b.classList.add('done'); dots.append(b); });
    card.append(dots);
  }
  card.append(el('div',{class:'qnum'},`Питання ${S.idx+1} з ${qset.length}`), el('div',{class:'qtext',html:q.text}));
  const body=el('div'); card.append(body);
  const ans = att.answers[qi];
  const ro = review;
  ({ddimageortext:renderDD,choice:renderChoice,shortanswer:renderText,numerical:renderText,matching:renderMatch})[q.type](body,q,qi,ans,ro,att);

  const prev=el('button',{class:'btn',disabled:S.idx===0,onclick:()=>{S.idx--;S.sel=null;render();}},'← Назад');
  let next;
  if(S.idx<qset.length-1) next=el('button',{class:'btn primary',onclick:()=>{S.idx++;S.sel=null;render();}},'Далі →');
  else if(review) next=el('button',{class:'btn primary',onclick:()=>{S.view='result';render();}},'До результатів');
  else next=el('button',{class:'btn primary',onclick:finish},'Завершити');
  card.append(el('div',{class:'row end'},prev,next));
  app.append(card);
}

function finish(){
  const att=S.cur;
  const miss=att.qset.filter(qi=>!answered(qi,att.answers[qi])).length;
  if(miss && !confirm(`Без відповіді: ${miss}. Завершити тест?`)) return;
  att.scores={}; att.qset.forEach(qi=>att.scores[qi]=grade(qi,att.answers[qi]));
  att.done=new Date();
  S.attempts.push(att); S.cur=null; S.view='result'; render();
}

/* ---------- shared drag / tap controller ---------- */
// chips: [data-v]; targets: [data-t]; pool: [data-pool]
function bindDnD(root, place, unplace){
  const key=v=>String(v);
  root.addEventListener('click',e=>{
    if(S._dragged){ S._dragged=false; return; }
    const chip=e.target.closest('[data-v]'), tgt=e.target.closest('[data-t]'), pool=e.target.closest('[data-pool]');
    if(chip && !(tgt && S.sel!=null && chip.dataset.v!==key(S.sel))){
      S.sel = S.sel===chip.dataset.v ? null : chip.dataset.v; render(); return;
    }
    if(tgt && S.sel!=null){ place(S.sel, tgt.dataset.t); return; }
    if(pool && S.sel!=null){ unplace(S.sel); }
  });
  root.addEventListener('pointerdown',e=>{
    const chip=e.target.closest('[data-v]'); if(!chip || e.button>0) return;
    const v=chip.dataset.v, sx=e.clientX, sy=e.clientY;
    let ghost=null, hot=null;
    const target=(x,y)=>{ const t=document.elementFromPoint(x,y); return t && (t.closest('[data-t]')||t.closest('[data-pool]')); };
    const mv=ev=>{
      if(!ghost){ if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<6) return;
        ghost=chip.cloneNode(true); ghost.classList.add('ghost'); ghost.classList.remove('sel');
        ghost.style.fontSize='15px'; ghost.style.width='auto'; ghost.style.height='auto'; ghost.style.maxWidth='280px';
        document.body.append(ghost); chip.style.opacity='.35'; }
      ghost.style.left=ev.clientX+'px'; ghost.style.top=ev.clientY+'px';
      const edge=70; if(ev.clientY<edge) window.scrollBy(0,-14); else if(ev.clientY>innerHeight-edge) window.scrollBy(0,14);
      const t=target(ev.clientX,ev.clientY); if(t!==hot){ hot&&hot.classList.remove('hot'); hot=t; hot&&hot.classList.add('hot'); }
      ev.preventDefault();
    };
    const up=ev=>{
      window.removeEventListener('pointermove',mv); window.removeEventListener('pointerup',up); window.removeEventListener('pointercancel',up);
      if(!ghost) return;
      ghost.remove(); chip.style.opacity=''; hot&&hot.classList.remove('hot');
      S._dragged=true; setTimeout(()=>S._dragged=false,60);
      const t=target(ev.clientX,ev.clientY);
      if(t && t.dataset.t!=null) place(v, t.dataset.t);
      else if(t && t.dataset.pool) unplace(v);
      else render();
    };
    window.addEventListener('pointermove',mv,{passive:false}); window.addEventListener('pointerup',up); window.addEventListener('pointercancel',up);
  });
}
const markSel=root=>{ if(S.sel!=null) root.querySelectorAll('[data-v]').forEach(c=>{ if(c.dataset.v===S.sel) c.classList.add('sel'); }); };

/* ---------- drag & drop on image ---------- */
function renderDD(body,q,qi,ans,ro,att){
  const a = ans || {};
  if(!ro){ att.answers[qi]=a; body.append(el('div',{class:'hint'},'Перетягніть назви на потрібні місця або торкніться назви, а потім поля.')); }
  const W=q.w, H=q.h;
  const stage=el('div',{class:'stage',style:`max-width:min(${Math.round(W*1.5)}px, calc((100vh - 300px) * ${W} / ${H}), 100%);min-width:min(100%, 300px)`}, el('img',{src:q.img,alt:'',draggable:'false'}));
  const longest=Math.max(...q.drags.map(d=>d.text.length));
  const zw=Math.max(60, longest*8.2+18), zh=26;
  const fontCq=(12.5/W*100).toFixed(3);
  const chipFor=no=>el('button',{class:'chip nw','data-v':no,type:'button'},q.drags.find(x=>x.no===no).text);
  q.drops.forEach(d=>{
    const w=Math.min(zw, W-d.x);
    const z=el('button',{class:'zone',type:'button','data-t':d.no,'aria-label':'Поле '+d.no,
      style:`left:${d.x/W*100}%;top:${d.y/H*100}%;width:${w/W*100}%;height:${zh/H*100}%;font-size:${fontCq}cqw`});
    if(a[d.no]!=null){ z.append(chipFor(a[d.no])); if(ro) z.classList.add(a[d.no]===d.choice?'ok':'bad'); }
    else if(ro) z.classList.add('bad');
    stage.append(z);
  });
  body.append(stage);
  if(ro) return;
  const pool=el('div',{class:'pool','data-pool':'1'});
  const placed=new Set(Object.values(a));
  const free=q.drags.filter(d=>d.infinite||!placed.has(d.no));
  free.forEach(d=>pool.append(chipFor(d.no)));
  if(!free.length) pool.append(el('span',{class:'empty'},'Усі назви розміщено. Щоб змінити, перетягніть назву з поля.'));
  body.append(pool);
  markSel(body);
  bindDnD(body,(v,t)=>{ v=+v; t=+t; const d=q.drags.find(x=>x.no===v);
      if(!d.infinite) for(const k of Object.keys(a)) if(a[k]===v) delete a[k];
      a[t]=v; S.sel=null; render(); },
    v=>{ v=+v; for(const k of Object.keys(a)) if(a[k]===v) delete a[k]; S.sel=null; render(); });
}
/* ---------- other types ---------- */
function renderChoice(body,q,qi,ans,ro,att){
  if(!q._order){ q._order=q.opts.map((_,i)=>i); if(q.shuffle) q._order.sort(()=>Math.random()-.5); }
  if(!q.single && !ro && !att.answers[qi]) att.answers[qi]=[];
  if(!q.single) body.append(el('div',{class:'hint'},'Можна вибрати кілька варіантів.'));
  q._order.forEach(i=>{
    const o=q.opts[i];
    const chosen = q.single ? ans===i : (ans||[]).includes(i);
    const inp=el('input',{type:q.single?'radio':'checkbox',name:'q'+qi,checked:chosen,disabled:ro});
    const lab=el('label',{class:'opt'},inp,el('span',{html:o.html}));
    if(ro && chosen) lab.classList.add(o.f>0?'ok':'bad');
    inp.addEventListener('change',()=>{
      if(q.single) att.answers[qi]=i;
      else { const s=new Set(att.answers[qi]); inp.checked?s.add(i):s.delete(i); att.answers[qi]=[...s]; }
    });
    body.append(lab);
  });
}
function renderText(body,q,qi,ans,ro,att){
  const inp=el('input',{type:'text',value:ans||'',disabled:ro,'aria-label':'Відповідь',placeholder:'Ваша відповідь'});
  if(ro) inp.classList.add(grade(qi,ans)>=0.999?'ok':'bad');
  inp.addEventListener('input',()=>att.answers[qi]=inp.value);
  body.append(inp);
}
function renderMatch(body,q,qi,ans,ro,att){
  const a = ans || {}; if(!ro) att.answers[qi]=a;
  if(!q._choices){ q._choices=[...new Set(q.pairs.map(p=>p.a))].sort(()=>Math.random()-.5); }
  const C=q._choices;
  const prompts=q.pairs.map((p,i)=>({i,html:p.q.replace(/^<p>|<\/p>$/g,''),a:p.a})).filter(p=>q.pairs[p.i].q);
  const bucket = C.length < prompts.length;
  const plain=h=>h.replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').trim();
  const visual = prompts.some(p=>/<img/i.test(p.html)) || (prompts.every(p=>plain(p.html).length<=22) && C.every(c=>c.length<=26));
  const done=()=>{ S.sel=null; render(); };

  if(bucket){
    if(!ro) body.append(el('div',{class:'hint'},'Розклади по групах: перетягни кожен об’єкт у потрібну групу або торкнися об’єкта, а потім групи.'));
    const chip=p=>{ const c=el('button',{class:'chip wr',type:'button','data-v':'p'+p.i,html:p.html});
      if(ro) c.classList.add(a[p.i]===p.a?'ok':'bad'); if(ro) c.disabled=true; return c; };
    const left=prompts.filter(p=>!a[p.i]);
    if(!ro || left.length){
      const pool=el('div',{class:'pool sticky','data-pool':ro?null:'1'});
      if(ro) pool.append(el('span',{class:'plabel'},'Без відповіді:'));
      left.forEach(p=>pool.append(chip(p)));
      if(!left.length) pool.append(el('span',{class:'empty'},'Усе розкладено. Щоб змінити, перетягни об’єкт в іншу групу.'));
      body.append(pool);
    }
    const grid=el('div',{class:'buckets'});
    C.forEach((c,ci)=>{
      const b=el('div',{class:'bucket','data-t':ro?null:ci}, el('div',{class:'bhead'},c));
      const inner=el('div',{class:'bbody'});
      prompts.filter(p=>a[p.i]===c).forEach(p=>inner.append(chip(p)));
      if(!inner.children.length && !ro) inner.append(el('span',{class:'empty'},'Перетягни сюди'));
      b.append(inner); grid.append(b);
    });
    body.append(grid);
    if(ro) return;
    markSel(body);
    bindDnD(body,(v,t)=>{ a[+v.slice(1)]=C[+t]; done(); }, v=>{ delete a[+v.slice(1)]; done(); });
    return;
  }

  // one-to-one: answer cards go into slots
  if(!ro) body.append(el('div',{class:'hint'},'Перетягни відповідь до кожного '+(visual?'зображення':'рядка')+' або торкнися відповіді, а потім поля.'));
  const used=new Set(Object.values(a));
  const achip=ci=>el('button',{class:'chip wr',type:'button','data-v':String(ci),disabled:ro},C[ci]);
  if(!ro){
    const pool=el('div',{class:'pool sticky','data-pool':'1'});
    const free=C.map((c,ci)=>ci).filter(ci=>!used.has(C[ci]));
    free.forEach(ci=>pool.append(achip(ci)));
    if(!free.length) pool.append(el('span',{class:'empty'},'Усі відповіді розміщено. Щоб змінити, перетягни відповідь назад сюди.'));
    body.append(pool);
  }
  const wrap=el('div',{class:visual?'mcards':'mrows'});
  prompts.forEach(p=>{
    const slot=el('div',{class:'slot','data-t':ro?null:String(p.i)});
    if(a[p.i]!=null) slot.append(achip(C.indexOf(a[p.i])));
    else slot.append(el('span',{class:'ph'},ro?'немає відповіді':'перетягни сюди'));
    if(ro) slot.classList.add(a[p.i]===p.a?'ok':'bad');
    wrap.append(el('div',{class:'mitem'}, el('div',{class:'mq',html:p.html}), slot));
  });
  body.append(wrap);
  if(ro) return;
  markSel(body);
  bindDnD(body,(v,t)=>{ const c=C[+v]; for(const k of Object.keys(a)) if(a[k]===c) delete a[k]; a[+t]=c; done(); },
    v=>{ const c=C[+v]; for(const k of Object.keys(a)) if(a[k]===c) delete a[k]; done(); });
}
/* ---------- results ---------- */
function totals(att){
  let got=0,max=0; att.qset.forEach(qi=>{ got+=att.scores[qi]*Q[qi].grade; max+=Q[qi].grade; }); return {got,max};
}
function viewResult(){
  const first=S.attempts[0], last=S.attempts[S.attempts.length-1];
  const {got,max}=totals(first); const pct=max?Math.round(got/max*100):0;
  // current status of each question: best across attempts
  const best={}; S.attempts.forEach(a=>a.qset.forEach(qi=>best[qi]=Math.max(best[qi]??0,a.scores[qi])));
  const wrongNow=Q.map((_,i)=>i).filter(i=>best[i]<0.999);
  const lastWrong=last.qset.filter(qi=>last.scores[qi]<0.999);

  const card=el('section',{class:'card'},
    el('h2',{},'Результат'),
    el('div',{class:'score'}, el('span',{class:'big'},pct+'%'), el('span',{class:'of'},`${fmt(got)} з ${fmt(max)} ${plural(Math.round(max),'бала','балів','балів')} · перша спроба`)),
    el('div',{class:'bar'},el('i',{style:`width:${pct}%`}))
  );
  const ul=el('ul',{class:'list'});
  Q.forEach((q,i)=>{ const f=first.scores[i]??0, st=status(f), b=best[i];
    const fixed = st!=='ok' && b>=0.999;
    ul.append(el('li',{}, el('span',{class:'tag '+st},statusText[st]), el('span',{class:'nm'},`${i+1}. ${q.name}`),
      fixed?el('span',{class:'tag ok'},'виправлено'):null,
      el('span',{class:'pts'},`${fmt(f*q.grade)} / ${fmt(q.grade)}`))); });
  card.append(ul);

  if(S.attempts.length>1){
    card.append(el('p',{class:'note'},`Повторних спроб: ${S.attempts.length-1}. Оцінка рахується за першою спробою.`));
  }

  const act=el('div',{class:'row',style:'margin-top:14px'});
  if(lastWrong.length){
    act.append(el('button',{class:'btn',onclick:()=>{S.reviewAtt=last;S.reviewSet=lastWrong;S.idx=0;S.view='review';render();}},'Переглянути помилки'));
  }
  if(wrongNow.length){
    act.append(el('button',{class:'btn teal',onclick:()=>startAttempt(wrongNow)},`Повторити неправильні (${wrongNow.length})`));
  } else {
    card.append(el('p',{class:'note'},S.attempts.length>1?'Усі помилки виправлено. Молодець!':'Усі відповіді правильні. Молодець!'));
  }
  if(act.children.length) card.append(act);

  const rep=report();
  card.append(el('div',{class:'sec'},
    el('h3',{},'Надіслати результат вчителю'),
    el('p',{class:'note'},'Скопіюйте результат і вставте в повідомлення або завантажте файл і прикріпіть його.'),
    el('div',{class:'row'},
      el('button',{class:'btn primary',onclick:()=>copy(rep)},'Скопіювати результат'),
      el('button',{class:'btn',onclick:()=>download(rep)},'Завантажити файл'))
  ));
  app.append(card);
}

function report(){
  const d=x=>x.toLocaleString('uk-UA',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  const first=S.attempts[0]; const {got,max}=totals(first);
  const L=[];
  L.push('ДистОсвіта · dystosvita.org.ua', `Тест: ${DATA.title}`, `Учень: ${S.name}${S.cls?' ('+S.cls+')':''}`, `Дата: ${d(first.done)}`, '',
    `Результат (перша спроба): ${fmt(got)} з ${fmt(max)} (${max?Math.round(got/max*100):0}%)`);
  Q.forEach((q,i)=>{ const f=first.scores[i]??0; L.push(`  ${i+1}. ${q.name}: ${statusText[status(f)]} (${fmt(f*q.grade)}/${fmt(q.grade)})`); });
  if(S.attempts.length>1){
    L.push('', 'Повторні спроби:');
    S.attempts.slice(1).forEach((a,k)=>{ const ok=a.qset.filter(qi=>a.scores[qi]>=0.999).length;
      L.push(`  Спроба ${k+2} (${d(a.done)}): виправлено ${ok} з ${a.qset.length}`); });
  }
  return L.join('\n');
}
function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>x.classList.remove('on'),1800)}
function copy(t){
  const fb=()=>{const ta=el('textarea',{style:'position:fixed;opacity:0'});ta.value=t;document.body.append(ta);ta.select();try{document.execCommand('copy');toast('Скопійовано');}catch(e){prompt('Скопіюйте вручну:',t);}ta.remove();};
  if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(t).then(()=>toast('Скопійовано'),fb); else fb();
}
function download(t){
  const safe=(S.name||'учень').replace(/[\\/:*?"<>|]+/g,'').replace(/\s+/g,'_');
  const a=el('a',{href:URL.createObjectURL(new Blob([t],{type:'text/plain;charset=utf-8'})),download:`Результат_${safe}.txt`});
  document.body.append(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}
window.addEventListener('beforeunload',e=>{ if(S.view==='quiz'){ e.preventDefault(); e.returnValue=''; } });
render();
</script>
