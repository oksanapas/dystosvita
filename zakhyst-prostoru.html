<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Захист особистого цифрового простору</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f7f1;--card:#fff;--ink:#1d2b22;--muted:#5b6d61;--line:#dbe6dc;--pri:#2e8b57;--pri-soft:#e2f3e8;
--ok:#1f9d6b;--ok-soft:#e3f6ee;--bad:#d64545;--bad-soft:#fdeaea;--warn:#e9a21a;--warn-soft:#fff4dc;--blue:#2f6fed;--blue-soft:#e6eeff;--r:16px}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.5}
.wrap{max-width:780px;margin:0 auto;padding:18px 16px 50px}
header{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:12px;background:var(--pri);display:grid;place-items:center;flex:none}
h1{font-size:20px;margin:0;line-height:1.2}
header small{color:var(--muted);font-weight:700}
.pts{margin-left:auto;background:#fff;border-radius:99px;padding:6px 14px;font-weight:900;color:var(--pri);box-shadow:0 1px 6px rgba(0,0,0,.06);white-space:nowrap}
.map{display:flex;gap:6px;margin:16px 0 14px;flex-wrap:wrap}
.map b{flex:1;min-width:44px;height:8px;border-radius:99px;background:var(--line)}
.map b.done{background:var(--pri)}.map b.cur{background:#8fd0a9}
.card{background:var(--card);border-radius:var(--r);padding:22px;box-shadow:0 2px 10px rgba(30,60,40,.06);margin-bottom:16px}
.kicker{font-size:13px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--pri)}
h2{font-size:23px;margin:2px 0 8px}
p{margin:6px 0 12px}.lead{color:var(--muted)}
.def{border-left:5px solid var(--pri);background:var(--pri-soft);padding:12px 14px;border-radius:10px;margin:10px 0}
.def.blue{border-color:var(--blue);background:var(--blue-soft)}
.btn{font:inherit;font-weight:800;border:0;border-radius:12px;padding:12px 22px;cursor:pointer;background:var(--pri);color:#fff}
.btn.ghost{background:#fff;color:var(--pri);border:2px solid var(--pri-soft)}
.btn:disabled{opacity:.4;cursor:default}
.nav{display:flex;justify-content:space-between;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{font:inherit;font-weight:700;border:2px solid var(--line);background:#fff;color:var(--ink);padding:10px 16px;border-radius:12px;cursor:pointer}
.opt.on{background:var(--pri);border-color:var(--pri);color:#fff}
input[type=text],textarea{width:100%;font:inherit;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:#fbfdfb}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--pri);background:#fff}
label.q{display:block;font-weight:800;margin:16px 0 6px}
.err{border-color:var(--bad)!important}
.errmsg{color:var(--bad);font-weight:800;font-size:15px;margin-top:10px;display:none}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;font-weight:700;display:none}
.fb.good{display:block;background:var(--ok-soft);color:#14674a}
.fb.badf{display:block;background:var(--bad-soft);color:#9b2c2c}
.fb.info{display:block;background:var(--warn-soft);color:#7a5200}
/* message sorter */
.msgcard{border:2px solid var(--line);border-radius:14px;padding:14px;background:#fff;margin-bottom:12px}
.msgcard .from{font-size:13px;color:var(--muted);font-weight:800}
.msgcard .body{margin:4px 0 10px}
.msgcard .opts .opt{padding:8px 12px;font-size:15px}
.msgcard.right{border-color:var(--ok);background:var(--ok-soft)}
.msgcard.wrong{border-color:var(--bad);background:var(--bad-soft)}
.msgcard .why{font-size:14.5px;margin-top:8px;display:none}
.msgcard.right .why,.msgcard.wrong .why{display:block}
/* email hunt */
.mail{border:2px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.mail .top{background:#f4f6f8;padding:12px 14px;font-size:15px;border-bottom:1px solid var(--line)}
.mail .content{padding:16px;font-size:16px}
.hs{cursor:pointer;border-radius:6px;padding:1px 3px;transition:.15s;border-bottom:2px dotted transparent}
.hs:hover{background:#fff6cc}
.hs.found{background:#ffe0e0;border-bottom-color:var(--bad)}
.fakebtn{display:inline-block;background:#1a73e8;color:#fff;padding:8px 16px;border-radius:8px;font-weight:800;margin-top:6px}
.found-list{display:grid;gap:6px;margin-top:12px}
.found-list div{padding:8px 12px;border-radius:10px;background:#f4f6f8;color:var(--muted);font-weight:700;font-size:15px}
.found-list div.on{background:var(--ok-soft);color:#14674a}
/* true/false */
.tf{border:2px solid var(--line);border-radius:14px;padding:16px;text-align:center}
.tf .stmt{font-size:19px;font-weight:800;margin:6px 0 14px;min-height:58px}
.tf .row{justify-content:center}
.big{font-size:18px;padding:14px 26px}
.btn.red{background:var(--bad)}
.counter{font-size:14px;font-weight:800;color:var(--muted)}
/* actions */
.acts{display:grid;gap:10px}
.act{display:flex;gap:12px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;font-weight:700;background:#fff}
.act .box{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;background:#fff;font-weight:900}
.act.on{border-color:var(--blue);background:var(--blue-soft)}.act.on .box{background:var(--blue);border-color:var(--blue);color:#fff}
.act.right{border-color:var(--ok);background:var(--ok-soft)}
.act.wrong{border-color:var(--bad);background:var(--bad-soft)}
.act .why{display:block;font-weight:600;font-size:14px;color:var(--muted)}
/* detox */
.slider{width:100%;accent-color:var(--pri)}
.hours{font-size:40px;font-weight:900;color:var(--pri);text-align:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{border:2px solid var(--line);border-radius:14px;padding:12px;text-align:center;cursor:pointer;font-weight:800;background:#fff}
.tile span{display:block;font-size:30px}
.tile.on{border-color:var(--pri);background:var(--pri-soft)}
.links a{display:block;color:var(--blue);font-weight:700;margin:4px 0}
pre.sum{white-space:pre-wrap;background:#f7faf7;border:2px dashed var(--line);border-radius:12px;padding:14px;font-family:inherit;font-size:14.5px;max-height:320px;overflow:auto}
.hero{text-align:center;font-size:56px}
.badge{display:inline-block;background:var(--warn-soft);color:#7a5200;border-radius:99px;padding:4px 12px;font-weight:900;font-size:14px}
footer{font-size:13px;color:var(--muted);text-align:center;margin-top:24px}
footer a{color:inherit}

.role{display:inline-block;background:var(--warn-soft);color:#7a5200;font-weight:900;font-size:14px;border-radius:99px;padding:4px 12px;margin:2px 0 10px}
.phone{border:2px solid var(--line);border-radius:18px;overflow:hidden;background:#e7ede8;max-width:520px;margin:0 auto 6px}
.ph-top{display:flex;align-items:center;gap:10px;background:#fff;padding:10px 14px;border-bottom:1px solid var(--line)}
.ph-top small{display:block;color:var(--muted);font-size:12.5px}
.ph-body{padding:12px;display:flex;flex-direction:column;gap:8px}
.av{width:32px;height:32px;border-radius:50%;color:#fff;font-weight:900;display:grid;place-items:center;flex:none;font-size:15px}
.av.grp{background:var(--pri-soft);font-size:17px}
.bub{display:flex;gap:8px;align-items:flex-end;max-width:88%;animation:pop .3s}
.bub .txt{background:#fff;border-radius:14px 14px 14px 4px;padding:7px 12px;font-size:15.5px;white-space:pre-line}
.bub .txt b{display:block;font-size:12.5px}
.bub.me{align-self:flex-end}
.bub.me .txt{background:#d3f0dc;border-radius:14px 14px 4px 14px}
.sys{align-self:center;text-align:center;font-size:13px;color:var(--muted);background:rgba(255,255,255,.7);border-radius:99px;padding:3px 12px;font-style:italic;animation:pop .3s}
.sys.act-sys{background:#fff3d6;color:#7a5200;font-style:normal;font-weight:700;border-radius:12px;max-width:90%}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.choices{display:grid;gap:10px}
.choice{font:inherit;text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;cursor:pointer;font-weight:700;color:var(--ink)}
.choice:hover{border-color:var(--pri);background:var(--pri-soft)}
.choice .lbl{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:900;margin-bottom:2px}
.plus{display:block;font-weight:600;font-size:14.5px;color:#7a5200;margin-top:3px}
.review{display:grid;gap:10px}
.rv{border:2px solid var(--line);border-radius:14px;padding:12px 14px;opacity:.85}
.rv.mine{opacity:1;box-shadow:0 0 0 3px rgba(47,111,237,.25)}
.rv.best{border-color:var(--ok);background:var(--ok-soft)}
.rv.mid{border-color:var(--warn);background:var(--warn-soft)}
.rv.bad{border-color:#f0b4b4;background:var(--bad-soft)}
.rv-h{font-weight:900;font-size:14.5px}
.rv-t{margin:4px 0;font-weight:700}
.rv-w{font-size:15px;color:#3d4a42}
.you{background:var(--blue);color:#fff;border-radius:99px;padding:1px 8px;font-size:12px;margin-left:6px}
.sumcase{border-left:5px solid var(--line);background:#f7faf7;border-radius:10px;padding:10px 14px;margin:8px 0;font-size:15.5px}
.sumcase.best{border-color:var(--ok)}.sumcase.mid{border-color:var(--warn)}.sumcase.bad{border-color:var(--bad)}
.sumcase .key{color:var(--muted);font-size:14.5px;margin-top:4px}

.pwd{font-family:ui-monospace,Consolas,monospace;font-size:19px;font-weight:700;background:#f4f6f8;border-radius:8px;padding:6px 12px;display:inline-block;margin-bottom:10px;word-break:break-all}
.tip-warn{background:var(--bad-soft);color:#9b2c2c;font-weight:700;border-radius:10px;padding:10px 14px;margin:10px 0;font-size:15px}
.meter{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}.meter i{display:block;height:100%;width:0;transition:.3s}
.mlabel{font-weight:900;margin:4px 0 8px}
.checks{display:grid;gap:4px;font-size:15px;color:var(--muted);font-weight:700}.checks .on{color:#14674a}
.privwrap{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
@media(max-width:680px){.privwrap{grid-template-columns:1fr}.stranger{position:static!important}}
.settings{border:2px solid var(--line);border-radius:14px;overflow:hidden}
.set{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);background:#fff}
.set:last-child{border-bottom:0}.set.right{background:var(--ok-soft)}.set.wrong{background:var(--bad-soft)}
.set-t b{display:block;font-size:15.5px}.set-t small{display:block;color:var(--muted);font-size:13px}.set-t .sw{color:#333;margin-top:3px}
.tgl{width:50px;height:28px;border-radius:99px;border:0;background:#c8d1cb;position:relative;cursor:pointer;flex:none}
.tgl i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.tgl.on{background:var(--pri)}.tgl.on i{left:25px}
.seg{display:flex;border:2px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.seg button{font:inherit;font-size:13.5px;font-weight:800;border:0;background:#fff;padding:6px 9px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--pri);color:#fff}
.stranger{position:sticky;top:10px;border:2px dashed #b9c6bd;border-radius:14px;padding:14px;background:#fafcfa}
.st-h{font-weight:900;font-size:14px;color:var(--muted);margin-bottom:10px}
.prof{display:flex;gap:12px;align-items:center}.prof small{display:block;font-size:13px;color:var(--muted)}.prof .grn{color:var(--ok);font-weight:800}
.pav{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#8fd0a9,#2e8b57);color:#fff;font-weight:900;font-size:22px;display:grid;place-items:center;position:relative;flex:none}
.onl{position:absolute;right:2px;bottom:2px;width:13px;height:13px;border-radius:50%;background:#2ecc71;border:2px solid #fff}
.lockbox{margin:12px 0;padding:22px;text-align:center;background:#eef2ef;border-radius:12px;font-weight:800;color:var(--muted)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:12px 0}
.grid3 div{aspect-ratio:1;background:#e2ebe5;border-radius:6px;display:grid;place-items:center;font-size:26px;position:relative}
.grid3 span{position:absolute;bottom:3px;left:3px;right:3px;font-size:10px;background:rgba(214,69,69,.9);color:#fff;border-radius:4px;font-weight:800;text-align:center}
.wbtn{width:100%;font:inherit;font-weight:800;border:0;border-radius:10px;padding:8px;background:var(--blue);color:#fff}
.wbtn:disabled{background:#d7ddd9;color:var(--muted)}
.warnline{display:block;color:#9b2c2c;font-weight:700;font-size:13px;margin-top:6px}
.sico{font-size:22px}
.flags{margin:6px 0 12px;padding-left:22px}.flags li{margin:3px 0}
.contacts{display:grid;gap:6px}.contacts div{background:#f4f6f8;border-radius:10px;padding:9px 12px;font-weight:700}
.contacts a{color:var(--blue)}
.ddwrap{margin-top:14px;border:2px solid var(--pri-soft);border-radius:14px;padding:4px 14px 14px;background:#fbfefc}
.ddh{font-weight:900;color:var(--pri);margin-top:10px}

.gradebox{display:flex;align-items:center;justify-content:center;gap:14px;margin:10px auto 6px}
.gnum{width:84px;height:84px;border-radius:22px;background:var(--pri);color:#fff;font-size:44px;font-weight:900;display:grid;place-items:center}
.gradebox b{display:block;font-size:19px}.gradebox small{display:block;color:var(--muted);font-weight:700}
.lvls{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0}@media(max-width:560px){.lvls{grid-template-columns:1fr}}
.lvls div{background:#f4f6f8;border-radius:10px;padding:7px 12px;font-weight:700;font-size:15px;color:var(--muted)}.lvls .on{background:var(--ok-soft);color:#14674a}
.finrow{text-align:center;margin-top:14px}
.finbtn{font:inherit;font-weight:800;font-size:15px;background:none;border:2px dashed #b9c6bd;color:var(--muted);border-radius:12px;padding:9px 16px;cursor:pointer}
.finbtn:hover{border-color:var(--pri);color:var(--pri)}.finbtn.sure{border-style:solid;border-color:var(--warn);background:var(--warn-soft);color:#7a5200}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
@media(max-width:560px){.card{padding:18px}.tf .stmt{font-size:17px}}
</style>
</head>

const TF=[

/* ---------- scoring ---------- */
function scSort(){return S.sortChecked?MSGS.filter(m=>S.sort[m.id]===m.a).length:0}
function scHunt(){return S.found.length}
function scTF(){return S.tfAns.filter((x,i)=>x===TF[i].a).length}
function scActs(){return S.actsChecked?ACTS.filter((x,i)=>S.acts.includes(i)===x.a).length:0}
function scCases(){return Object.entries(S.cases).reduce((s,[c,o])=>s+({best:2,mid:1,bad:0}[CASES[c].opts[o].kind]),0)}
function scPw(){return S.pwChecked?PWS.filter((x,i)=>S.pw[i]===x.a).length:0}
function scPriv(){return S.privChecked?PRIV.filter(x=>x.ok.includes(pv(x))).length:0}
function scShare(){return S.shareChecked?SHARE.filter((x,i)=>S.share[i]===x.a).length:0}
function scRec(){return S.rec.end?S.rec.picks.length&&REC.stages[S.rec.picks.length-1].opts[S.rec.picks.at(-1)].pts||0:0}
function pv(x){return S.priv[x.id]===undefined?x.def:S.priv[x.id]}
MAX.pw=PWS.length;MAX.priv=PRIV.length;MAX.share=SHARE.length;MAX.rec=3;
function total(){return scPw()+scSort()+scHunt()+scTF()+scPriv()+scShare()+scCases()+scActs()+scRec()}

 "Приватність":()=>S.privChecked,"Чи варто поширювати":()=>S.shareChecked,"Кібербулінг у чаті":()=>S.caseIdx>=CASES.length,"Кібербулінг":()=>S.actsChecked,"Вербування":()=>!!S.rec.end,"Цифровий детокс":()=>S.detox.length>=3&&!!S.plan.trim()};
const LVLNAME={"Паролі":"Надійні паролі","Спам чи фішинг":"Спам чи фішинг","Шахрайський лист":"Ознаки шахрайства","Правда чи міф":"Правда чи міф","Приватність":"Налаштування приватності","Чи варто поширювати":"Поширити чи ні","Кібербулінг у чаті":"Кібербулінг у чаті","Кібербулінг":"Дії при шантажі","Вербування":"Вербування","Цифровий детокс":"Цифровий детокс"};
function grade(){return Math.max(1,Math.round(total()/MAXT*12))}
function gradeLevel(g){return g>=10?"високий рівень":g>=7?"достатній рівень":g>=4?"середній рівень":"початковий рівень"}
function doneCount(){return Object.values(DONE).filter(f=>f()).length}
const MAXT=MAX.pw+MAX.sort+MAX.hunt+MAX.tf+MAX.priv+MAX.share+MAX.cases+MAX.acts+MAX.rec;

 }

function summary(){const recPath=S.rec.end?({good:"зупинив(ла) розмову і повідомив(ла) дорослих/СБУ на кроці "+S.rec.picks.length,silent:"видалив(ла) чат і нікому не сказав(ла)",bad:"виконав(ла) завдання вербувальника"})[S.rec.end]:"—";
 return [
`ЗАХИСТ ОСОБИСТОГО ЦИФРОВОГО ПРОСТОРУ`,`Клас: ${S.cls}`,`Учень/учениця: ${S.name}`,`ОЦІНКА: ${grade()} з 12 (${gradeLevel(grade())})`,`Бали: ${total()} з ${MAXT} · пройдено рівнів: ${doneCount()} з ${Object.keys(DONE).length}`,...(S.ret?[`Завершено достроково на рівні ${S.ret}`]:[]),``,
`1. Надійні паролі: ${scPw()} з ${MAX.pw}${nf("Паролі")}; склав(ла) надійний пароль: ${S.pwMade?"так":"ні"}`,
`2. Спам чи фішинг: ${scSort()} з ${MAX.sort}${nf("Спам чи фішинг")}`,
`3. Ознаки шахрайства знайдено: ${scHunt()} з ${MAX.hunt}${nf("Шахрайський лист")}`,
`4. Правда чи міф: ${scTF()} з ${MAX.tf}${nf("Правда чи міф")}`,
`5. Налаштування приватності: ${scPriv()} з ${MAX.priv}${nf("Приватність")}`,
`6. Поширити чи ні: ${scShare()} з ${MAX.share}${nf("Чи варто поширювати")}`,
`7. Кейси про кібербулінг у чаті: ${scCases()} з ${MAX.cases}${nf("Кібербулінг у чаті")}`,
...CASES.map((c,i)=>`   ${i+1}) ${c.role}: ${S.cases[i]===undefined?"—":KIND[c.opts[S.cases[i]].kind][0]}`),
`8. Дії при шантажі: ${scActs()} з ${MAX.acts}${nf("Кібербулінг")}`,
`9. Вербування: ${scRec()} з ${MAX.rec} — ${recPath}${nf("Вербування")}`,``,
`10. Цифровий детокс${nf("Цифровий детокс")}`,`   Екранний час: ${hoursLabel(S.hours)} на день`,
...OFF.filter(o=>S.detox.includes(o[1])).map(o=>`   ${o[0]} ${o[1]}: ${S.dd[o[1]]||"—"}`),
`   Коли: ${S.plan}`].join("\n");}

/* ---------- helpers ---------- */
function ddFields(){return S.detox.length?`<div class="ddwrap"><div class="ddh">✏️ Допиши конкретику до кожного заняття</div>${OFF.filter(o=>S.detox.includes(o[1])).map(([i,t,q,ph])=>`<label class="q">${i} ${t}: <span style="font-weight:600">${q}</span></label><input type="text" class="ddi" data-t="${t}" value="${esc(S.dd[t]||"")}" placeholder="${esc(ph)}">`).join("")}</div>`:""}
function bindDD(){document.querySelectorAll(".ddi").forEach(el=>el.oninput=()=>{S.dd[el.dataset.t]=el.value;save();el.classList.remove("err");clr();});}

function $(s){return document.querySelector(s)}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function hoursLabel(h){const n=Math.floor(h),m=h%1?" 30 хв":"";return `${n} год${m}`}
function txt(id,k){const el=document.getElementById(id);el.oninput=()=>{S[k]=el.value;save();el.classList.remove("err");clr();};}
function pick(sel,fn){document.querySelectorAll(sel+" .opt").forEach(b=>b.onclick=()=>{fn(b.dataset.v);save();document.querySelectorAll(sel+" .opt").forEach(x=>x.classList.toggle("on",x===b));clr();});}
function err(m){const e=$("#errmsg");e.textContent="⚠️ "+m;e.style.display="block";return false;}
function clr(){const e=$("#errmsg");if(e)e.style.display="none";}
function fb(s,m,msg){const f=$("#fb");f.className="fb "+(s===m?"good":"info");f.textContent=msg||(s===m?`🎉 Чудово! ${s} з ${m}.`:`Правильно: ${s} з ${m}. Прочитай пояснення.`);}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200);}

function draw(){
 const st=STEPS[S.step],last=STEPS.length-1;
 $("#pts").textContent="⭐ "+total()+" · 🎓 "+grade();
 $("#map").innerHTML=STEPS.map((x,i)=>`<b class="${i<S.step?'done':i===S.step?'cur':''}" title="${x.name}"></b>`).join("");
 $("#app").innerHTML=`<div class="card">${st.render()}<div class="errmsg" id="errmsg"></div></div>`+
  (st.final?"":`<div class="nav"><button class="btn ghost" id="back" ${S.step===0?'disabled':''}>← Назад</button><button class="btn" id="next">${S.step===last-1?'Завершити ✓':'Далі →'}</button></div>${S.step>0&&S.step<last-1?`<div class="finrow"><button class="finbtn" id="fin">🏁 Завершити зараз і отримати оцінку</button></div>`:''}`);
 st.bind&&st.bind();
 if(!st.final){$("#back").onclick=()=>{S.step--;save();draw();scrollTo(0,0);};
  $("#next").onclick=()=>{if(!st.valid())return;S.step++;if(S.step===last)S.ret=null;save();draw();scrollTo(0,0);};
  $("#fin")&&($("#fin").onclick=()=>{const b=$("#fin");if(!b.dataset.sure){b.dataset.sure=1;b.classList.add("sure");b.textContent=`Точно завершити? Поточна оцінка: ${grade()} з 12. Натисни ще раз`;return;}
   S.ret=S.step;S.step=last;save();draw();scrollTo(0,0);});}
}
if(S.step>=STEPS.length)S.step=0;
draw();
</script>
</body>
</html>
