<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Педагогічний детектив: що насправді сталося?</title>
<style>
:root{--ink:#182023;--green:#b8ff6d;--deep:#277a48;--line:#d6dfd6;--paper:#f6f8f3;--white:#fff;--blue:#2469e8}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:18px/1.48 Arial,Helvetica,sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}.wrap{max-width:1040px;margin:auto;padding:28px 22px 70px}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:24px}.brand{font-weight:900;letter-spacing:.03em}.tag{font-size:14px;color:#4a5d4c}.hero{background:var(--green);border-radius:24px;padding:44px;min-height:330px;display:flex;flex-direction:column;justify-content:center}.eyebrow{font-size:15px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#295236}h1{font-size:clamp(36px,5vw,64px);line-height:1.06;margin:13px 0 20px;max-width:780px}h2{font-size:clamp(27px,3.2vw,38px);line-height:1.16;margin:7px 0 20px}h3{font-size:22px;margin:0 0 15px}.lead{font-size:22px;max-width:760px;margin:0 0 25px}.small{font-size:15px;color:#48604d}.primary,.secondary{border:0;border-radius:12px;padding:13px 22px;font-weight:800}.primary{background:var(--ink);color:#fff}.primary:hover{background:#315042}.primary:disabled{background:#a8b3a9;cursor:not-allowed}.secondary{background:#e8f3e6;color:#164a30}.secondary:hover{background:#d7ebd4}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:30px;margin:18px 0}.case{border-left:8px solid #58c96c}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.choice{background:#fff;border:2px solid var(--line);border-radius:15px;padding:15px 18px;text-align:left;min-height:72px}.choice:hover{border-color:#53b867}.choice.selected{border-color:#257745;background:#e8f8e9}.choice.opened{border-color:#4e9a6b;background:#f1faef}.choice.good{border-color:#23884a;background:#e3f7e8}.choice.bad{border-color:#d4775c;background:#fff2ed}.evidence{margin-top:9px;padding:14px 17px;border-radius:12px;background:#f0f6ef;border-left:4px solid #5ec274}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:22px}.notice{padding:17px 20px;border-radius:14px;background:#e8f3e6;margin-top:18px}.reveal{background:#dfffad;border:1px solid #8fd64d;border-radius:20px;padding:26px;margin:20px 0}.reveal strong{color:#1e673a}.progress{height:10px;background:#e3e9df;border-radius:10px;overflow:hidden}.progress span{display:block;height:100%;background:#60c86c;transition:width .3s}.bar{display:flex;justify-content:space-between;gap:18px;align-items:center;margin:16px 0 20px}.bar p{margin:0;font-weight:700}.pill{display:inline-block;background:#e6f5e7;color:#1f6840;border-radius:999px;padding:6px 11px;font-size:14px;font-weight:700}.feedback{font-weight:700;margin:14px 0}.footer{margin-top:32px;font-size:14px;color:#526057}.hidden{display:none}.summary li{margin:12px 0}@media(max-width:670px){.wrap{padding:18px 14px 50px}.hero{padding:27px;min-height:0}.lead{font-size:19px}.card{padding:22px}.grid{grid-template-columns:1fr}.top{align-items:flex-start}.tag{text-align:right}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="brand">ПЕДАГОГІЧНИЙ ДЕТЕКТИВ</div><div class="tag">Модуль 6 · Адаптація навчання</div></header>
<main id="app" aria-live="polite"></main>
<footer class="footer">Інтерактив працює без інтернету. Перший вибір не оцінюється: важливо перевіряти припущення, перш ніж діяти.</footer>
</div>
<script>
const cases=[
 {title:'Учень мовчить і не виконує практичну роботу',story:'На онлайн-уроці учень не відкрив редактор коду, не надіслав роботу й майже не говорив.',hunches:['Не знає тему','Не хоче працювати','Боїться помилитися','Не зрозумів інструкцію'],checks:[['Запитати приватно, як іде робота','Сьогодні учень підключився зі смартфона.'],['Перевірити доступ до середовища','Редактор коду на його пристрої не запускається.'],['Дати коротке завдання без редактора','Учень правильно пояснив алгоритм словами.'],['Подивитися на попередні роботи','У попередній роботі він самостійно написав подібний код.']],truth:'Учень знає матеріал, але сьогодні має лише смартфон. Потрібний редактор на ньому не працює.',response:['Повторити всю тему з початку','Дати спосіб описати алгоритм зі смартфона, а код завершити після відновлення доступу','Поставити нуль за практичну роботу'],correct:1,why:'Ви зберігаєте навчальну мету і змінюєте спосіб виконання на час технічного обмеження.'},
 {title:'Новий учень не долучається до роботи групи',story:'Учень прийшов з іншої школи. На спільному занятті група працює над проєктом, а він сидить осторонь.',hunches:['Йому нецікавий проєкт','Не має досвіду командної роботи','Соромиться незнайомого класу','Не розуміє тему'],checks:[['Запитати, що він бачить на екрані','Посилання на спільний файл відкривається лише для учнів зі шкільними акаунтами.'],['Дати невелику роль у групі','Учень охоче пропонує ідеї усно, коли бачить завдання.'],['Перевірити запрошення до проєкту','Новий акаунт ще не додали до спільного простору.'],['Переглянути попередній досвід','У попередній школі учень уже виконував групові проєкти.']],truth:'Учень не отримав доступу до спільного простору. Він не бачить матеріалів, з якими працює група.',response:['Попросити його просто спостерігати до кінця уроку','Надати доступ, коротко пояснити правила роботи й доручити видиму частину завдання','Перевести його на окрему спрощену тему'],correct:1,why:'Усуньте перешкоду входу в роботу і дайте учневі можливість показати попередній досвід.'},
 {title:'Після перерви клас помиляється в простому завданні',story:'Більшість учнів невдало виконали практичне завдання з аналізу даних. Здається, доведеться повторювати всю тему.',hunches:['Забули попередній матеріал','Неуважно читали умову','Завдання надто складне','Втратили мотивацію'],checks:[['Попросити пояснити перший крок','Учні по-різному розуміють, які саме дані потрібно порівнювати.'],['Показати приклад вхідних даних','Після прикладу більшість учнів самі обирають правильний спосіб аналізу.'],['Перевірити повторно формулювання завдання','Умова використовує слово «результат» для двох різних показників.'],['Переглянути попередню роботу','Минулого разу учні правильно виконували такий самий тип аналізу.']],truth:'Причина в неоднозначній інструкції: слово «результат» позначає два різні показники. Учні по-різному зрозуміли, які саме показники потрібно порівняти, тому використали різні дані.',response:['Повторити весь розділ для всього класу','Уточнити умову, показати приклад даних і дати нову спробу','Оцінити першу спробу як незнання теми'],correct:1,why:'Виправлення інструкції перевіряє саме потрібну навичку і не приписує учням прогалину без доказів.'}
];
const app=document.getElementById('app');
let index=0,phase='intro',hunch=-1,opened=new Set(),answer=-1,correctCount=0;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function button(label,action,cls='primary',disabled=false){return `<button type="button" class="${cls}" data-action="${action}" ${disabled?'disabled':''}>${esc(label)}</button>`}
function resetCase(){hunch=-1;opened=new Set();answer=-1;phase='hunch';render()}
function header(){return `<div class="bar"><p>Кейс ${index+1} із ${cases.length}</p><span class="pill">Перший вибір без оцінки</span></div><div class="progress" aria-label="Прогрес"><span style="width:${Math.round(index/cases.length*100)}%"></span></div>`}
function render(){
 if(phase==='intro'){app.innerHTML=`<section class="hero"><div class="eyebrow">Інтерактив для роботи в групах</div><h1>Що насправді сталося?</h1><p class="lead">Побачте ситуацію, оберіть перше припущення, перевірте його й лише тоді вирішіть, як допомогти учневі.</p><div>${button('Почати розслідування','start')}</div></section><div class="card"><h3>Як проводити</h3><p>Один учасник демонструє сторінку в кімнаті Zoom. Група домовляється про вибір перед кожним натисканням.</p></div>`;return}
 if(phase==='done'){app.innerHTML=`<section class="hero"><div class="eyebrow">Розслідування завершено</div><h1>Спочатку перевірка. Потім рішення.</h1><p class="lead">Вдалих рішень щодо підтримки: ${correctCount} із ${cases.length}.</p>${button('Пройти ще раз','restart')}</section><div class="card summary"><h3>Для обговорення після гри</h3><ol><li>Яке перше припущення здалося вам переконливим?</li><li>Яке запитання або перевірка змінило вашу думку?</li><li>Як дати підтримку, зберігши спільний навчальний результат?</li></ol><p class="small">Кейси є навчальними прикладами. У реальній роботі причину встановлюють за даними конкретного учня та ситуації.</p></div>`;return}
 const c=cases[index];let html=header()+`<section class="card case"><div class="eyebrow">Ситуація</div><h2>${esc(c.title)}</h2><p class="lead">${esc(c.story)}</p></section>`;
 if(phase==='hunch')html+=`<section class="card"><h3>Яке припущення виникає першим?</h3><p class="small">Тут немає оцінки. Оберіть версію, яку ви захотіли б перевірити.</p><div class="grid">${c.hunches.map((x,i)=>`<button type="button" class="choice ${hunch===i?'selected':''}" data-action="hunch" data-i="${i}" aria-pressed="${hunch===i}">${esc(x)}</button>`).join('')}</div><div class="actions">${button('Перевірити припущення','toChecks','primary',hunch<0)}</div></section>`;
 if(phase==='checks')html+=`<section class="card"><h3>Ваша перша версія: «${esc(c.hunches[hunch])}»</h3><p>Оберіть щонайменше дві перевірки. Вони відкриють нові дані.</p><div class="grid">${c.checks.map(([label,info],i)=>`<div><button type="button" class="choice ${opened.has(i)?'opened':''}" data-action="check" data-i="${i}" aria-expanded="${opened.has(i)}">${esc(label)}</button>${opened.has(i)?`<div class="evidence">${esc(info)}</div>`:''}</div>`).join('')}</div><div class="actions">${button('Відкрити справжню причину','reveal','primary',opened.size<2)}<span class="small">Перевірено: ${opened.size} із 4</span></div></section>`;
 if(phase==='response')html+=`<section class="reveal"><div class="eyebrow">Справжня причина</div><h2>${esc(c.truth)}</h2><p>Перше припущення було можливим. Нові дані показали іншу причину.</p></section><section class="card"><h3>Яке рішення ви ухвалите тепер?</h3><div class="grid">${c.response.map((x,i)=>`<button type="button" class="choice ${answer===i?(i===c.correct?'good':'bad'):''}" data-action="answer" data-i="${i}" ${answer>=0?'disabled':''}>${esc(x)}</button>`).join('')}</div>${answer>=0?`<p class="feedback">${answer===c.correct?'Так, це рішення враховує перевірену причину.':'Це рішення не усуває встановленої перешкоди.'}</p><p>${esc(c.why)}</p><div class="actions">${button(index<cases.length-1?'Наступний кейс':'Підсумок','next')}</div>`:''}</section>`;
 app.innerHTML=html;
}
app.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,i=Number(b.dataset.i);if(a==='start'){index=0;correctCount=0;resetCase()}else if(a==='restart'){index=0;correctCount=0;phase='intro';render()}else if(a==='hunch'){hunch=i;render()}else if(a==='toChecks'&&hunch>=0){phase='checks';render()}else if(a==='check'){opened.add(i);render()}else if(a==='reveal'&&opened.size>=2){phase='response';render()}else if(a==='answer'&&answer<0){answer=i;if(i===cases[index].correct)correctCount++;render()}else if(a==='next'){index++;if(index===cases.length){phase='done';render()}else resetCase()}});
render();
</script>
</body>
</html>

</body></html>
