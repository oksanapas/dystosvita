<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Етапи ІТ-проєкту</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #F6F7FB;
    --ink: #141B3C;
    --chip: #141B3C;
    --chip-text: #FFFFFF;
    --chip-edge: #2F62F0;
    --slot: #E2E4EB;
    --slot-edge: #141B3C;
    --muted: #5B6476;
    --ok: #1E8A43;
    --bad: #C62828;
    --accent: #2F62F0;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --bg: #12151C; --ink: #EEF1F6; --chip: #2A3566; --chip-text: #FFFFFF; --chip-edge: #6F93FF;
        --slot: #222836; --slot-edge: #8892A8; --muted: #A3ABBA; --ok: #4CC777; --bad: #FF6B6B; --accent: #6F93FF;
    }
}
:root[data-theme="dark"] {
    --bg: #12151C; --ink: #EEF1F6; --chip: #2A3566; --chip-text: #FFFFFF; --chip-edge: #6F93FF;
    --slot: #222836; --slot-edge: #8892A8; --muted: #A3ABBA; --ok: #4CC777; --bad: #FF6B6B; --accent: #6F93FF;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Manrope", "Segoe UI", Arial, sans-serif;
}

.wrap { max-width: 1160px; margin: 0 auto; padding: 28px 20px 40px; }

h1 { font-size: clamp(22px, 3vw, 30px); font-weight: 800; margin: 0 0 6px; text-align: center; }
.lead { text-align: center; color: var(--muted); margin: 0 0 26px; font-weight: 600; }

/* ---------- Пул ---------- */

.pool {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    min-height: 64px;
    margin: 0 auto 34px;
    max-width: 840px;
}

.chip {
    width: 150px;
    height: 56px;
    display: grid;
    place-items: center;
    padding: 0 8px;
    background: var(--chip);
    color: var(--chip-text);
    border: 2px solid var(--chip-edge);
    border-radius: 8px;
    font-weight: 800;
    font-size: 19px;
    cursor: grab;
    user-select: none;
    touch-action: manipulation;
}
.chip:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.chip.selected { box-shadow: 0 0 0 4px #B8F04A; }
.chip.dragging { position: fixed; z-index: 100; pointer-events: none; cursor: grabbing; transform: rotate(2deg); box-shadow: 0 10px 24px rgba(0,0,0,.25); }

/* ---------- Слоти ---------- */

.slots {
    display: grid;
    grid-template-columns: repeat(5, auto);
    gap: 14px 22px;
    justify-content: center;
}

.row { display: flex; align-items: center; gap: 10px; }

.num {
    width: 54px;
    flex: none;
    text-align: right;
    font-size: 34px;
    font-weight: 800;
    line-height: 1;
}
.num sup { font-size: .5em; }

.slot {
    width: 150px;
    height: 56px;
    border: 3px dashed var(--slot-edge);
    border-radius: 8px;
    background: var(--slot);
    display: grid;
    place-items: center;
    cursor: pointer;
}
.slot .chip { border-radius: 6px; width: 100%; height: 100%; }
.slot.over, .slots.armed .slot:empty { border-color: var(--accent); }
.slot.ok { border-style: solid; border-color: var(--ok); }
.slot.bad { border-style: solid; border-color: var(--bad); }
.slot:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

/* ---------- Кнопки ---------- */

.toolbar { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
button.btn {
    font-family: inherit; font-weight: 800; font-size: 16px;
    border-radius: 10px; padding: 12px 20px; cursor: pointer;
    border: 2px solid var(--ink); background: transparent; color: var(--ink);
}
button.btn.main { background: var(--ink); color: var(--bg); }
button.btn:disabled { opacity: .4; cursor: not-allowed; }
button.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.feedback { text-align: center; margin-top: 18px; font-weight: 800; font-size: 18px; min-height: 1.4em; }
.feedback.good { color: var(--ok); }
.feedback.bad { color: var(--bad); }

.answer {
    display: none;
    margin: 16px auto 0;
    max-width: 760px;
    text-align: center;
    color: var(--muted);
    font-weight: 600;
    line-height: 1.6;
}
.answer.visible { display: block; }
.answer b { color: var(--ink); }

@media (max-width: 1100px) {
    .slots { grid-template-columns: repeat(2, auto); }
}
@media (max-width: 560px) {
    .slots { grid-template-columns: auto; }
    .chip, .slot { width: 170px; }
    .num { font-size: 28px; }
}
@media (prefers-reduced-motion: reduce) {
    .chip.dragging { transform: none; }
}
</style>
</head>
<body>
<div class="wrap">
    <h1>Етапи реалізації ІТ-проєкту</h1>
    <p class="lead">Розташуйте етапи в правильному порядку: перетягніть картку в клітинку або натисніть на картку, а потім на клітинку.</p>

    <div class="pool" id="pool" aria-label="Етапи"></div>
    <div class="slots" id="slots"></div>

    <div class="toolbar">
        <button class="btn main" id="checkBtn" disabled>Перевірити</button>
        <button class="btn" id="showBtn" hidden>Показати правильний порядок</button>
        <button class="btn" id="resetBtn">Почати знову</button>
    </div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
    <p class="answer" id="answer"></p>
</div>

<script>
const ORDER = ["Проблема", "Замовник", "ТЗ", "Команда", "Спринти", "Прототип", "Тестування", "Продукт", "Презентація", "Портфоліо"];
const WHY = [
    "з'ясовуємо, яку проблему розв'язуємо",
    "дізнаємося, кому й навіщо це потрібно",
    "фіксуємо вимоги, обмеження й критерії",
    "розподіляємо ролі",
    "плануємо роботу короткими етапами",
    "робимо першу робочу версію",
    "перевіряємо її з користувачами",
    "доводимо до готового результату",
    "захищаємо результат перед замовником",
    "фіксуємо доказ своєї роботи"
];

const pool = document.getElementById("pool");
const slotsBox = document.getElementById("slots");
const checkBtn = document.getElementById("checkBtn");
const showBtn = document.getElementById("showBtn");
const feedback = document.getElementById("feedback");
const answer = document.getElementById("answer");
let selected = null;

function shuffle(a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function init() {
    pool.innerHTML = "";
    slotsBox.innerHTML = "";
    ORDER.forEach((_, i) => {
        const row = document.createElement("div");
        row.className = "row";
        row.innerHTML = `<div class="num">${i + 1}<sup>-й</sup></div>`;
        const slot = document.createElement("div");
        slot.className = "slot";
        slot.dataset.index = i;
        slot.tabIndex = 0;
        slot.setAttribute("role", "button");
        slot.setAttribute("aria-label", `Позиція ${i + 1}`);
        slot.addEventListener("click", e => {
            const inside = e.target.closest(".chip");
            if (selected && selected !== inside) place(selected, slot);
            else if (inside && !selected) select(inside);
            else if (inside === selected) { deselect(); }
        });
        slot.addEventListener("keydown", e => {
            if ((e.key === "Enter" || e.key === " ") && selected) { e.preventDefault(); place(selected, slot); }
        });
        row.appendChild(slot);
        slotsBox.appendChild(row);
    });
    shuffle(ORDER).forEach(w => pool.appendChild(makeChip(w)));
    selected = null;
    clearMarks();
    answer.classList.remove("visible");
    showBtn.hidden = true;
    update();
}

function makeChip(word) {
    const c = document.createElement("div");
    c.className = "chip";
    c.textContent = word;
    c.dataset.word = word;
    c.tabIndex = 0;
    c.setAttribute("role", "button");
    bindChip(c);
    return c;
}

function update() {
    checkBtn.disabled = pool.children.length > 0;
    slotsBox.classList.toggle("armed", !!selected);
}

function clearMarks() {
    document.querySelectorAll(".slot").forEach(s => s.classList.remove("ok", "bad"));
    feedback.textContent = "";
    feedback.className = "feedback";
}

function select(chip) {
    if (selected === chip) { deselect(); return; }
    deselect();
    selected = chip;
    chip.classList.add("selected");
    update();
}
function deselect() {
    if (selected) selected.classList.remove("selected");
    selected = null;
    update();
}

/* Покласти картку в клітинку; якщо клітинка зайнята — обміняти */
function place(chip, slot) {
    const from = chip.parentElement;
    const occupant = slot.querySelector(".chip");
    if (occupant && occupant !== chip) {
        if (from.classList.contains("slot")) from.appendChild(occupant);
        else pool.appendChild(occupant);
    }
    slot.appendChild(chip);
    deselect();
    clearMarks();
    answer.classList.remove("visible");
    update();
}

function toPool(chip) {
    pool.appendChild(chip);
    deselect();
    clearMarks();
    update();
}

pool.addEventListener("click", e => {
    if (e.target === pool && selected) toPool(selected);
});

function bindChip(chip) {
    let sx, sy, ox, oy, dragging = false, justDragged = false, ph = null;

    function target(x, y) {
        const el = document.elementFromPoint(x, y);
        if (!el) return null;
        return el.closest(".slot") || el.closest("#pool");
    }
    function onMove(e) {
        if (!dragging) {
            if (Math.hypot(e.clientX - sx, e.clientY - sy) < 6) return;
            dragging = true;
            const r = chip.getBoundingClientRect();
            ox = sx - r.left; oy = sy - r.top;
            ph = document.createElement("div");
            ph.style.width = r.width + "px";
            ph.style.height = r.height + "px";
            chip.after(ph);
            chip.style.width = r.width + "px";
            chip.style.height = r.height + "px";
            chip.classList.add("dragging");
            deselect();
        }
        chip.style.left = (e.clientX - ox) + "px";
        chip.style.top = (e.clientY - oy) + "px";
        const t = target(e.clientX, e.clientY);
        document.querySelectorAll(".slot").forEach(s => s.classList.toggle("over", s === t));
    }
    function finish(e, cancel) {
        window.removeEventListener("pointermove", onMove);
        window.removeEventListener("pointerup", onUp);
        window.removeEventListener("pointercancel", onCancel);
        if (!dragging) return;
        const t = cancel ? null : target(e.clientX, e.clientY);
        chip.classList.remove("dragging");
        chip.style.left = chip.style.top = chip.style.width = chip.style.height = "";
        document.querySelectorAll(".slot.over").forEach(s => s.classList.remove("over"));
        ph.replaceWith(chip);
        ph = null;
        if (t && t.classList.contains("slot")) place(chip, t);
        else if (t && t.id === "pool") toPool(chip);
        dragging = false;
        justDragged = true;
        setTimeout(() => { justDragged = false; }, 0);
    }
    function onUp(e) { finish(e, false); }
    function onCancel(e) { finish(e, true); }

    chip.addEventListener("pointerdown", e => {
        if (e.pointerType === "touch" || e.button !== 0) return;
        e.preventDefault();
        sx = e.clientX; sy = e.clientY; dragging = false;
        window.addEventListener("pointermove", onMove);
        window.addEventListener("pointerup", onUp);
        window.addEventListener("pointercancel", onCancel);
    });

    chip.addEventListener("click", e => {
        if (justDragged) return;
        if (chip.parentElement.classList.contains("slot")) {
            e.stopPropagation();
            if (selected && selected !== chip) { place(selected, chip.parentElement); return; }
            if (selected === chip) { toPool(chip); return; }
            select(chip);
            return;
        }
        select(chip);
    });

    chip.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); e.stopPropagation(); select(chip); }
        const n = Number(e.key);
        if (n >= 1 && n <= ORDER.length) { e.preventDefault(); place(chip, document.querySelector(`.slot[data-index="${n - 1}"]`)); }
        if (e.key === "Backspace" || e.key === "Delete") { e.preventDefault(); toPool(chip); }
    });
}

checkBtn.addEventListener("click", () => {
    let right = 0;
    document.querySelectorAll(".slot").forEach(s => {
        const chip = s.querySelector(".chip");
        const ok = chip && chip.dataset.word === ORDER[Number(s.dataset.index)];
        s.classList.toggle("ok", !!ok);
        s.classList.toggle("bad", !ok);
        if (ok) right++;
    });
    if (right === ORDER.length) {
        feedback.textContent = "Усе правильно! 🎉";
        feedback.className = "feedback good";
        showAnswer();
        showBtn.hidden = true;
    } else {
        feedback.textContent = `Правильно: ${right} з ${ORDER.length}. Червоні етапи переставте й перевірте ще раз.`;
        feedback.className = "feedback bad";
        showBtn.hidden = false;
    }
});

function showAnswer() {
    answer.innerHTML = ORDER.map((w, i) => `<b>${w}</b>: ${WHY[i]}`).join(" → ");
    answer.classList.add("visible");
}

showBtn.addEventListener("click", showAnswer);
document.getElementById("resetBtn").addEventListener("click", init);

init();
</script>
</body>
</html>
